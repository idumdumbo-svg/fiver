function learnNext(id){const r=rec(id);r.seen++;r.last=Date.now();S.totalNew++;save();sess.idx++;renderSession();}

/* --- quiz --- */
function realTokCount(it){return it.tok.filter(t=>!/^[?？！!、]/.test(t.t.trim())).length;}
function eligibleTypes(it){
  const types=["jp2en","en2jp"];
  if(realTokCount(it)>=3)types.push("build");
  if(ART_MAP[it.id])types.push("picture");
  if(particleTok(it))types.push("particle");
  return types;
}
/* build a mixed question set from a pool of items. `known` = ids the learner
   has met, used to gate conversational modes whose answer must be recognisable */
function makeQuestions(pool,cap){
  const qs=[];
  pool.forEach(it=>{const ts=eligibleTypes(it);qs.push({it,type:ts[Math.floor(Math.random()*ts.length)]});});
  const known=new Set(seenIds().map(i=>i.id).concat(pool.map(i=>i.id)));
  shuffle(PAIRS.filter(p=>known.has(p.a))).slice(0,2).forEach(p=>qs.push({type:"respond",pair:p}));
  shuffle(SCENARIOS.filter(sc=>known.has(sc.a))).slice(0,2).forEach(sc=>qs.push({type:"scenario",sc}));
  // conversational drills — only once the answers are things you've actually met
  shuffle(REACTS.filter(r=>known.has(r.a))).slice(0,2).forEach(r=>qs.push({type:"react",r}));
  shuffle(CHAINS.filter(c=>c.turns.every(t=>known.has(t.a)))).slice(0,1).forEach(c=>qs.push({type:"chain",c}));
  return shuffle(qs).slice(0,cap);
}
function buildQuiz(){
  const s=sess;
  const pool=[...s.fresh,...s.review];
  if(!pool.length){s.phase="done";return;}
  s.quiz=makeQuestions(pool,12);s.qIdx=0;
}
const jpFmt=c=>`${esc(c.jp)}<span class="cr">${esc(c.ro)}</span>`;
function quizCard(){
  const s=sess,q=s.quiz[s.qIdx];
  if(!q){s.phase="done";return renderSession();}
  const top=sessTop(s.isTest?"TEST":"PRACTICE",s.qIdx/s.quiz.length);
  if(q.type==="build")return buildQ(q,top);
  if(q.type==="picture")return pictureQ(q,top);
  if(q.type==="respond")return respondQ(q,top);
  if(q.type==="scenario")return scenarioQ(q,top);
  if(q.type==="particle")return particleQ(q,top);
  if(q.type==="react")return reactQ(q,top);
  if(q.type==="chain")return chainQ(q);
  const it=q.it;
  let stem,choices;
  if(q.type==="jp2en"){
    stem=`<div class="mt20">${glossNoGloss(it)}</div><div class="sub center mt16">What does this mean?</div>`;
    const wrong=shuffle(ITEMS.filter(x=>x.id!==it.id)).slice(0,5);
    choices=shuffle([{txt:it.en,ok:true},...wrong.map(w=>({txt:w.en,ok:false}))]);
    renderMC(top,stem,choices,it,c=>esc(c.txt));
  }else{
    stem=`<div class="natural mt20" style="font-size:20px">${esc(it.en)}</div><div class="sub center mt16">How do you say it?</div>`;
    const wrong=shuffle(ITEMS.filter(x=>x.id!==it.id)).slice(0,5);
    choices=shuffle([{jp:jpText(it),ro:roText(it),ok:true},...wrong.map(w=>({jp:jpText(w),ro:roText(w),ok:false}))]);
    renderMC(top,stem,choices,it,jpFmt);
  }
}

/* --- picture match: illustration -> phrase --- */
function pictureQ(q,top){
  const it=q.it;
  const stem=`<div class="art big">${ART[ART_MAP[it.id]]}</div><div class="sub center mt16">Which phrase matches the picture?</div>`;
  const wrong=shuffle(ITEMS.filter(x=>x.id!==it.id)).slice(0,5);
  const choices=shuffle([{jp:jpText(it),ro:roText(it),ok:true},...wrong.map(w=>({jp:jpText(w),ro:roText(w),ok:false}))]);
  renderMC(top,stem,choices,it,jpFmt);
}
/* --- best response: her line -> your reply --- */
function respondQ(q,top){
  const p=q.pair,qi=ITEMS.find(i=>i.id===p.q),ai=ITEMS.find(i=>i.id===p.a);
  const stem=`<div class="bubble-who">She says</div><div class="bubble">
    <div class="bjp">${esc(jpText(qi))}</div><div class="bro">${esc(roText(qi))}</div><div class="ben">"${esc(qi.en)}"</div></div>
    <div class="sub center mt16">Pick your best reply.</div>`;
  const wrong=shuffle(ITEMS.filter(x=>x.id!==ai.id&&x.id!==qi.id)).slice(0,5);
  const choices=shuffle([{jp:jpText(ai),ro:roText(ai),ok:true},...wrong.map(w=>({jp:jpText(w),ro:roText(w),ok:false}))]);
  renderMC(top,stem,choices,ai,jpFmt,{emo:"💬",explain:p.why});
}
/* --- situation match: scene -> phrase --- */
function scenarioQ(q,top){
  const sc=q.sc,ai=ITEMS.find(i=>i.id===sc.a);
  const stem=`<div class="situation"><span class="semo">${sc.emo||"🗺️"}</span>${esc(sc.s)}</div><div class="sub center mt16">What do you say?</div>`;
  const wrong=shuffle(ITEMS.filter(x=>x.id!==ai.id)).slice(0,5);
  const choices=shuffle([{jp:jpText(ai),ro:roText(ai),ok:true},...wrong.map(w=>({jp:jpText(w),ro:roText(w),ok:false}))]);
  renderMC(top,stem,choices,ai,jpFmt,{emo:sc.emo||"🗺️",explain:sc.why});
}
/* --- reaction drill: her statement -> the right aizuchi --- */
function reactQ(q,top){
  const r=q.r,ai=ITEMS.find(i=>i.id===r.a);
  const stem=`<div class="bubble-who">She says</div><div class="bubble">
    <div class="bjp">${esc(r.t)}</div><div class="bro">${esc(r.r)}</div><div class="ben">"${esc(r.en)}"</div></div>
    <div class="sub center mt16">React. What noise does a Japanese speaker make here?</div>`;
  const pool=REACTION_POOL.filter(id=>id!==r.a).map(id=>ITEMS.find(i=>i.id===id)).filter(Boolean);
  const wrong=shuffle(pool).slice(0,5);
  const choices=shuffle([{jp:jpText(ai),ro:roText(ai),ok:true},...wrong.map(w=>({jp:jpText(w),ro:roText(w),ok:false}))]);
  renderMC(top,stem,choices,ai,jpFmt,{emo:"👂",explain:r.why});
}

/* --- chain drill: a whole two-turn exchange, one card --- */
function chainQ(q){window._ch={c:q.c,step:0};renderChain();}
function chLine(who,l){return bubbleHTML({who,t:l.t,r:l.r,en:l.en});}
function chAnswer(id){const it=ITEMS.find(i=>i.id===id);return{t:jpText(it),r:roText(it),en:it.en};}
function renderChain(){
  const st=window._ch,c=st.c,done=st.step>=c.turns.length;
  const top=sessTop(sess.isTest?"TEST":"CONVERSATION",sess.qIdx/sess.quiz.length);
  let chat=`<div class="setting-banner">${esc(c.setting)}</div>`;
  c.turns.forEach((t,i)=>{
    if(i<=st.step)chat+=chLine("her",t.say);
    if(i<st.step)chat+=chLine("you",chAnswer(t.a));
  });
  let ctrl="";
  if(done){
    ctrl=`<div class="mnem"><span class="emo">${c.emo}</span><span class="txt">${c.turns[c.turns.length-1].why}</span></div>
      <button class="btn primary mt16" onclick="quizNext()">NEXT</button>`;
  }else{
    const t=c.turns[st.step],ai=ITEMS.find(i=>i.id===t.a);
    const wrong=(t.alt||[]).map(id=>ITEMS.find(i=>i.id===id)).filter(Boolean);
    const extra=shuffle(ITEMS.filter(x=>x.id!==t.a&&!(t.alt||[]).includes(x.id))).slice(0,Math.max(0,5-wrong.length));
    const opts=shuffle([{jp:jpText(ai),ro:roText(ai),ok:true},...wrong.concat(extra).map(w=>({jp:jpText(w),ro:roText(w),ok:false}))]);
    window._chOpts=opts;
    ctrl=`<div class="sub center mb">Turn ${st.step+1} of ${c.turns.length} — your reply.</div>
      <div class="choices">${opts.map((o,k)=>`<button class="choice" id="cc${k}" onclick="pickChain(${k})">${jpFmt(o)}</button>`).join("")}</div>
      <div id="chAfter" class="hidden"><div class="mnem"><span class="emo">${c.emo}</span><span class="txt">${t.why}</span></div>
        <button class="btn primary mt16" onclick="advChain()">つづける ▸</button></div>`;
  }
  app.innerHTML=`<div class="fade">${top}<div class="card" style="padding:20px 16px"><div class="chat" style="margin-bottom:4px">${chat}</div>${ctrl}</div></div>`;
}
function pickChain(k){
  const st=window._ch,opts=window._chOpts,t=st.c.turns[st.step],ok=opts[k].ok;
  if(st.locked)return;st.locked=true;
  opts.forEach((o,j)=>{if(o.ok)$("cc"+j).classList.add("right");});
  if(!ok)$("cc"+k).classList.add("wrong");
  grade(t.a,ok);ok?sess.right++:sess.wrong++;
  sess.results[t.a]=sess.results[t.a]===false?false:ok;
  $("chAfter").classList.remove("hidden");
}
function advChain(){window._ch.step++;window._ch.locked=false;renderChain();}

/* --- fill the particle --- */
function particleQ(q,top){
  const it=q.it,pt=particleTok(it);
  const disp=it.tok.map((t,idx)=>idx===pt.i
    ?`<div class="tok"><span class="ro">?</span><span class="jp blank">◯</span></div>`
    :`<div class="tok"><span class="ro">${esc(t.r)}</span><span class="jp">${esc(t.t)}</span></div>`).join("");
  const stem=`<div class="gloss md mt8">${disp}</div><div class="natural">${esc(it.en)}</div><div class="sub center mt16">Which particle fills the gap?</div>`;
  const wrong=shuffle(PARTICLE_POOL.filter(x=>x.t!==pt.t)).slice(0,5);
  const choices=shuffle([{jp:pt.t,ro:pt.r,ok:true},...wrong.map(w=>({jp:w.t,ro:w.r,ok:false}))]);
  renderMC(top,stem,choices,it,jpFmt);
}
function glossNoGloss(it){
  return `<div class="gloss md">`+it.tok.map(t=>
    `<div class="tok"><span class="ro">${esc(t.r)}</span><span class="jp">${esc(t.t)}</span></div>`).join("")+`</div>`;
}
let lock=false;
function renderMC(top,stem,choices,it,fmt,opts){
  opts=opts||{};lock=false;
  const emo=opts.emo||it.emo,explain=opts.explain||it.mn;
  app.innerHTML=`<div class="fade">${top}<div class="card" style="padding:26px 18px">${stem}
    <div class="choices">${choices.map((c,i)=>
      `<button class="choice" id="ch${i}" onclick="pick(${i})">${fmt(c)}</button>`).join("")}</div>
    <div id="after" class="hidden"><div class="mnem"><span class="emo">${emo}</span><span class="txt">${explain}</span></div>
    <button class="btn primary mt16" onclick="quizNext()">NEXT</button></div>
  </div></div>`;
  window._choices=choices;window._qit=it;
}
function pick(i){
  if(lock)return;lock=true;
  const cs=window._choices,it=window._qit,ok=cs[i].ok;
  cs.forEach((c,j)=>{if(c.ok)$("ch"+j).classList.add("right");});
  if(!ok)$("ch"+i).classList.add("wrong");
  grade(it.id,ok);ok?sess.right++:sess.wrong++;
  sess.results[it.id]=sess.results[it.id]===false?false:ok;
  $("after").classList.remove("hidden");
}
function quizNext(){sess.qIdx++;renderSession();}

/* --- sentence builder --- */
function buildQ(q,top){
  const it=q.it;
  const toks=it.tok.map((t,i)=>({...t,i})).filter(t=>!/^[？?！!]/.test(t.t.trim()));
  window._b={it,order:toks.map(t=>t.i),placed:[],toks};
  const pool=shuffle(toks);
  app.innerHTML=`<div class="fade">${top}<div class="card" style="padding:26px 18px">
    <div class="natural" style="font-size:19px;margin-top:0">${esc(it.en)}</div>
    <div class="sub center mt8" style="font-size:12px">Tap the words in Japanese order</div>
    <div class="built mt16" id="built"></div>
    <div class="pool">${pool.map(t=>
      `<button class="chip" id="pt${t.i}" onclick="place(${t.i})">${esc(t.t)}<small>${esc(t.r)}</small></button>`).join("")}</div>
    <div id="bres" class="hidden mt16"></div>
  </div></div>`;
}
function place(i){
  const b=window._b;
  b.placed.push(i);
  $("pt"+i).classList.add("used");
  const t=b.toks.find(t=>t.i===i);
  $("built").innerHTML+=`<span class="chip">${esc(t.t)}<small>${esc(t.r)}</small></span>`;
  if(b.placed.length===b.order.length){
    const ok=b.placed.every((v,k)=>v===b.order[k]);
    grade(b.it.id,ok);ok?sess.right++:sess.wrong++;
    sess.results[b.it.id]=sess.results[b.it.id]===false?false:ok;
    $("bres").classList.remove("hidden");
    $("bres").innerHTML=`<div class="natural" style="color:${ok?"var(--good)":"var(--bad)"}">${ok?"✓ Perfect":"✗ Not quite"}</div>
      ${ok?"":`<div class="mt12">${glossHTML(b.it,true)}</div>`}
      <button class="btn primary mt16" onclick="quizNext()">NEXT</button>`;
  }
}

/* --- session done --- */
function sessionDone(){
  const s=sess,total=s.right+s.wrong;
  const acc=total?Math.round(s.right/total*100):100;
  // streak
  const t=today(),y=new Date(Date.now()-DAY).toISOString().slice(0,10);
  if(S.lastDay!==t){S.streak=(S.lastDay===y)?S.streak+1:1;S.lastDay=t;}
  S.sessions++;save();
  const missed=Object.keys(s.results).filter(id=>s.results[id]===false).map(id=>ITEMS.find(i=>i.id===id));
  app.innerHTML=`<div class="fade center" style="display:flex;flex-direction:column;justify-content:center;flex:1">
    <div class="big-emo">${acc>=85?"🎉":acc>=60?"💪":"🌱"}</div>
    <div class="h1 mt16">おつかれさま！</div>
    <div class="sub mt8">Session done in ${Math.max(1,elapsed())} min · ${s.fresh.length} new phrases met</div>
    ${total?`<div class="score-ring mt16" style="color:${accColor(acc/100)}">${acc}%</div><div class="lbl">PRACTICE ACCURACY</div>`:""}
    <div class="sub mt16" style="max-width:400px;margin-left:auto;margin-right:auto">${honestSession(acc,total,missed)}</div>
    ${missed.length?`<div class="card mt20" style="text-align:left"><div class="lbl" style="margin-bottom:10px">SLIPPED TODAY — THEY'LL BE BACK TOMORROW</div>
      ${missed.map(m=>`<div class="spread" style="padding:6px 0"><span style="font-weight:600">${esc(jpText(m))}</span><span class="sub" style="font-size:12px">${esc(m.en)}</span></div>`).join("")}</div>`:""}
    <button class="btn primary mt20" onclick="home()">DONE</button></div>`;
}
function honestSession(acc,total,missed){
  if(!total)return "All new material today — the quiz kicks in next session.";
  if(acc>=90)return "That was clean. If it felt easy, it was — tomorrow will push harder with these in the review queue.";
  if(acc>=70)return "Solid, not solid <i>enough</i> to coast. The ones you missed aren't learned yet — meeting them again tomorrow is what locks them in.";
  if(acc>=50)return "Honest read: about half of this hasn't stuck. That's normal for new material, but don't add more units until this set stops slipping.";
  return "Rough one — most of these aren't in memory yet. Shorten the loop: re-run a session later today instead of waiting for tomorrow.";
}

/* ================= TEST ================= */
let test=null;
function startTest(){
  const qs=makeQuestions(shuffle(seenIds()),14);
  sess={quiz:qs,qIdx:0,right:0,wrong:0,t0:Date.now(),results:{},phase:"quiz",review:[],fresh:[],isTest:true};
  renderSession();
}
/* test shares the quiz renderer; done screen branches */
const _origDone=sessionDone;
sessionDone=function(){
  if(!sess.isTest)return _origDone();
  const total=sess.right+sess.wrong||1;
  const score=Math.round(sess.right/total*100);
  const perUnit={};
  Object.keys(sess.results).forEach(id=>{
    const it=ITEMS.find(i=>i.id===id);
    if(!perUnit[it.u])perUnit[it.u]={c:0,n:0};
    perUnit[it.u].n++;if(sess.results[id])perUnit[it.u].c++;
  });
  S.tests.push({date:today(),score});save();
  const rows=Object.keys(perUnit).map(u=>{
    const p=perUnit[u],a=p.c/p.n,un=UNITS.find(x=>x.id==u);
    return {un,a,n:p.n};
  }).sort((x,y)=>x.a-y.a);
  app.innerHTML=`<div class="fade">
    <div class="center mt20"><div class="lbl acc">TEST RESULT</div>
    <div class="score-ring mt12" style="color:${accColor(score/100)}">${score}%</div>
    <div class="sub mt8">${sess.right}/${total} correct · ${Math.max(1,Math.floor((Date.now()-sess.t0)/60000))} min</div></div>
    <div class="card mt20"><div class="lbl" style="margin-bottom:14px">BY TOPIC</div>
      ${rows.map(r=>`<div class="fb-row"><div class="spread">
        <span class="name">${r.un.emo} ${r.un.name}</span><span class="pct" style="color:${accColor(r.a)}">${Math.round(r.a*100)}%</span></div>
        <div class="pbar"><div style="width:${r.a*100}%;background:${accColor(r.a)}"></div></div></div>`).join("")}
    </div>
    <div class="card mt16"><div class="lbl" style="margin-bottom:10px">HONEST FEEDBACK</div>
      <div class="sub">${honestTest(score,rows)}</div></div>
    <button class="btn primary mt20" onclick="home()">DONE</button></div>`;
};
function honestTest(score,rows){
  const weak=rows.filter(r=>r.a<0.6).map(r=>r.un.name);
  const small=rows.some(r=>r.n<2)?" (Small sample on some topics — take another test in a few days for a truer read.)":"";
  if(score>=90)return `This is genuinely solid recall. You're ready to <b>use these out loud</b> — the gap between tapping the right answer and saying it to her at speed is the next wall, and only speaking breaks it.${small}`;
  if(score>=75)return `Good, but not conversational yet. ${weak.length?`<b>${weak.join(" and ")}</b> ${weak.length>1?"are":"is"} dragging you down — hit ${weak.length>1?"those units":"that unit"} in your next two sessions before adding anything new.`:"No single weak spot — just reps. Two more sessions and re-test."}${small}`;
  if(score>=50)return `Half-known is not known — in real conversation these will vanish under pressure. ${weak.length?`Start with <b>${weak[0]}</b>, your weakest topic.`:""} Stop adding new units, re-run reviews daily, and re-test in 3 days.${small}`;
  return `Straight up: this set isn't in memory yet, and that's fine — it means the sessions are still doing their job. Shrink the goal: pick <b>one unit</b>, run it daily until it hits 80%, then move on.${small}`;
}

function sceneTop(){

}
const WHO_NAME={you:"You",her:"Her",mum:"Her mum",dad:"Her dad",staff:"Shop staff",stranger:"A local",friend:"Her friend",guest:"Your guest",boss:"Your boss"};
function bubbleHTML(l){
  const you=l.who==="you";
  const name=WHO_NAME[l.who]||"Them";
  const chips=(l.nw||[]).map(id=>{const it=ITEMS.find(x=>x.id===id);
    return it?`<span class="nwchip"><b>${esc(jpText(it))}</b> ${esc(roText(it))} — ${esc(it.en)}</span>`:"";}).join("");
  return `<div class="cbwrap ${you?'you':'them'}"><div class="cbname">${name}</div>
    <div class="cbubble"><div class="cjp">${esc(l.t)}</div><div class="cro">${esc(l.r)}</div><div class="cen">${esc(l.en)}</div></div>
    ${chips?`<div class="nwrow">${chips}</div>`:""}</div>`;
}
function renderScene(){
  const sc=scene.def, L=scene.lines, shown=L.slice(0,scene.i), next=L[scene.i];
  const chat=`<div class="setting-banner">${esc(sc.setting)}</div>`+shown.map(bubbleHTML).join("");
  let controls="";
  if(!next){return sceneRecap();}
  const branching = next.who==="you" && next.branch;
  const interactive = next.who==="you" && (next.choose || branching || scene.mode==="roleplay");
  if(scene.fb) controls+=`<div class="sfb ${scene.fb.ok?'ok':'no'}">${scene.fb.msg}</div>`;
  if(interactive && !scene.fb){
    let opts;
    if(branching){
      // every option is a real thing you could say — the conversation bends to fit
      opts=shuffle(next.branch.map((b,bi)=>({t:b.t,r:b.r,ok:!!b.good,bi})));
      controls+=`<div class="sub center mb">Your turn — all of these work. Which do you mean?</div>`;
    }else{
      const correct={t:next.t,r:next.r,ok:true};
      const distr=(next.alt&&next.alt.length?next.alt:defaultAlts(next)).map(id=>{const it=ITEMS.find(x=>x.id===id);return{t:jpText(it),r:roText(it),ok:false};});
      opts=shuffle([correct,...distr]);
      controls+=`<div class="sub center mb">Your turn — what do you say?</div>`;
    }
    scene._opts=opts;
    controls+=`<div class="choices">`+
      opts.map((o,k)=>`<button class="choice" onclick="pickScene(${k})">${esc(o.t)}<span class="cr">${esc(o.r)}</span></button>`).join("")+`</div>`;
  } else {
    const label = scene.fb ? "つづける ▸" : (scene.i===0?"START ▸":(next.who==="you"?"SAY IT ▸":"つぎ ▸"));
    controls+=`<button class="btn primary mt8" onclick="revealNext()">${label}</button>`;
  }
  app.innerHTML=`<div class="fade">${sceneTop()}<div class="chat">${chat}</div>${controls}</div>`;
  window.scrollTo(0,document.body.scrollHeight);
}
function defaultAlts(next){ // used only in roleplay for lines with no preset distractors
  return shuffle(ITEMS.filter(i=>jpText(i)!==next.t)).slice(0,2).map(i=>i.id);
}
function revealNext(){ scene.fb=null; scene.i++; renderScene(); }
function pickScene(k){
  const o=scene._opts[k], line=scene.lines[scene.i];
  if(line.branch && o.bi!==undefined){
    // commit your choice into the transcript, then splice in what it makes her say
    const b=line.branch[o.bi];
    scene.lines[scene.i]={who:"you",t:b.t,r:b.r,en:b.en,nw:b.nw||[]};
    if(b.reply)scene.lines.splice(scene.i+1,0,b.reply);
    if(o.ok)scene.right++;else scene.wrong++;
    scene.fb={ok:!!o.ok,msg:b.fb||(o.ok?"✓ Natural — that's what a Japanese speaker would reach for.":"That works, but there's a smoother way. See how she takes it 👇")};
    scene.i++;renderScene();return;
  }
  if(o.ok){scene.right++;scene.fb={ok:true,msg:"✓ Perfect — that's the line."};}
  else{scene.wrong++;scene.fb={ok:false,msg:"Not quite. The natural reply comes next 👇"};}
  scene.i++; // reveal the correct line regardless
  renderScene();
}
function sceneRecap(){
  const sc=scene.def;
  const nw=sc.learn.map(id=>ITEMS.find(x=>x.id===id)).filter(Boolean);
  nw.forEach(it=>{const r=rec(it.id);if(!r.seen){r.seen++;r.last=Date.now();S.totalNew++;}});
  const first=!S.scenes[sc.id];
  S.scenes[sc.id]=today();save();
  const total=scene.right+scene.wrong;
  const acc=total?Math.round(scene.right/total*100):null;
  app.innerHTML=`<div class="fade center" style="display:flex;flex-direction:column;justify-content:center;flex:1">

}

/* ---------- text normalisation & recognition ---------- */
const normJP=s=>s.replace(/[\s　、。！!？?〜~…・.,\-]/g,"");
const normRO=s=>s.toLowerCase().replace(/[^a-z]/g,"");
/* every learnable chunk: whole phrases + their individual words */
const CHUNKS=(()=>{
  const out=[];const seen=new Set();
  ITEMS.forEach(it=>{
    const t=normJP(jpText(it));if(t&&!seen.has("p"+t)){seen.add("p"+t);out.push({t,ro:normRO(roText(it)),r:roText(it),en:it.en,id:it.id,kind:"phrase"});}
    it.tok.forEach(tk=>{const tt=normJP(tk.t);if(!tt||/^[?？!！]/.test(tk.t.trim()))return;
      if(seen.has("w"+tt))return;seen.add("w"+tt);
      out.push({t:tt,ro:normRO(tk.r),r:tk.r,en:tk.g.replace(/\[|\]/g,""),id:it.id,kind:"word"});});
  });
  return out.sort((a,b)=>b.t.length-a.t.length);
})();
const CHUNKS_RO=CHUNKS.filter(c=>c.ro).slice().sort((a,b)=>b.ro.length-a.ro.length);
/* segment a Japanese (or romaji) message into known chunks + leftovers */
function segmentInput(raw){
  const isRo=/^[a-zA-Z\s.,!?'~\-]+$/.test(raw.trim());
  let s=isRo?normRO(raw):normJP(raw);
  const segs=[];let i=0;
  while(i<s.length){
    let hit=null;
    for(const c of (isRo?CHUNKS_RO:CHUNKS)){const key=isRo?c.ro:c.t;if(s.startsWith(key,i)){hit=c;break;}}
    if(hit){segs.push({...hit,known:true});i+=(isRo?hit.ro:hit.t).length;}
    else{const last=segs[segs.length-1];const ch=s[i];
      if(last&&!last.known)last.t+=ch;else segs.push({t:ch,known:false});i++;}
  }
  return {segs,isRo};
}
/* items the message contains, as ids (for her to react to) */
function idsIn(segs){const ids=new Set();segs.filter(s=>s.known).forEach(s=>{ids.add(s.id);
  /* a bare word also counts as every phrase that is exactly that word */
  ITEMS.forEach(it=>{if(normJP(jpText(it))===s.t)ids.add(it.id);});});return ids;}
function segsHTML(segs){
  return `<div class="segs">`+segs.map(s=>s.known
    ?`<span class="seg"><b>${esc(s.t)}</b> <span class="sr">${esc(s.r)}</span> — ${esc(s.en)}</span>`
    :`<span class="seg unk">${esc(s.t)} — ?</span>`).join("")+`</div>`;
}
function segsMeaning(segs){
  const parts=segs.map(s=>s.known?s.en:"[?]");
  return parts.join(" · ");
}

/* ---------- English → Japanese (offline) ---------- */
function enWords(s){return s.toLowerCase().replace(/[^a-z' ]/g," ").split(/\s+/).filter(w=>w&&!EN_STOP.has(w));}
function scoreItem(it,words){
  const bag=new Set(enWords(it.en).concat(it.tok.map(t=>enWords(t.g.replace(/[\[\]\-\/]/g," "))).flat()).concat(enWords(EN_HINTS[it.id]||"")));
  let hit=0;words.forEach(w=>{if(bag.has(w))hit++;else{for(const b of bag){if(b.length>3&&(b.startsWith(w)||w.startsWith(b))){hit+=.6;break;}}}});
  if(!hit)return 0;
  const full=it.en.toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
  const q=words.join(" ");
  let bonus=0;if(full&&q===enWords(full).join(" "))bonus+=2;
  if(words._inp&&words._inp.length>3&&full.includes(words._inp))bonus+=.5;
  // texting her is casual — polite forms only win when asked for
  const polite=/polite/i.test(it.en)&&!words.includes("polite");
  return (hit/Math.sqrt(words.length)+bonus)*(polite?.6:1);
}
function en2jp(text){
  const knownSet=new Set(seenIds().map(i=>i.id));
  const rank=(chunk)=>{const words=enWords(chunk);if(!words.length)return[];
    words._inp=chunk.toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
    return ITEMS.map(it=>({it,s:scoreItem(it,words)*(knownSet.has(it.id)?1:.7)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,4);};
  const missingOf=(pieces)=>{const bag=new Set();pieces.forEach(it=>{enWords(it.en).forEach(w=>bag.add(w));it.tok.forEach(t=>enWords(t.g.replace(/[\[\]\-\/]/g," ")).forEach(w=>bag.add(w)));enWords(EN_HINTS[it.id]||"").forEach(w=>bag.add(w));});
    return enWords(text).filter(w=>!bag.has(w)&&![...bag].some(b=>b.length>3&&(b.startsWith(w)||w.startsWith(b))));};
  let best=rank(text);
  // several clauses → translate each, then stitch
  const clauses=text.split(/[,.!?;]| and | but | then /i).map(c=>c.trim()).filter(Boolean);
  if(clauses.length>1){
    const pieces=[];clauses.forEach(c=>{const r=rank(c);if(r.length&&r[0].s>=.7&&pieces[pieces.length-1]!==r[0].it)pieces.push(r[0].it);});
    if(pieces.length>1||(pieces.length&&!(best.length&&best[0].s>=1)))return {pieces,alts:best.slice(0,3).map(x=>x.it).filter(it=>!pieces.includes(it)),note:pieces[0].mn,partial:pieces.length<clauses.length,missing:missingOf(pieces)};
  }
  if(best.length&&best[0].s>=1)return {pieces:[best[0].it],alts:best.slice(1).map(x=>x.it),note:best[0].it.mn,missing:missingOf([best[0].it])};
  if(best.length)return {pieces:[best[0].it],alts:best.slice(1).map(x=>x.it),note:best[0].it.mn,weak:true,missing:missingOf([best[0].it])};
  return null;
}

/* ---------- her side (offline engine) ---------- */

function lineNW(line,known){return (line.need||[]).filter(id=>!known.has(id));}

  const known=chatKnown();
  const used=S.chat.used||[];

  // a fresh thread opens like a real one — with a greeting or a check-in
  if(!S.chat.log.length){const openers=["c1","c2","c19","c6","c10"].map(id=>CHAT_TOPICS.find(t=>t.id===id));
    const ok=openers.filter(t=>score(t)===0);return (ok.length?ok:[openers[0]])[Math.floor(Math.random()*(ok.length||1))];}
  let pool=CHAT_TOPICS.filter(t=>!used.includes(t.id));
  if(pool.length<4){S.chat.used=[];pool=CHAT_TOPICS.slice();}
  // prefer openers made entirely of phrases you've met; allow one new word if we must
  let fully=pool.filter(t=>score(t)===0);
  if(!fully.length)fully=pool.filter(t=>score(t)<=1);
  if(!fully.length)fully=pool.sort((a,b)=>score(a)-score(b)).slice(0,3);
  return fully[Math.floor(Math.random()*fully.length)];
}
function herSay(line,opts){
  const known=chatKnown();
  const nw=lineNW(line,known);
  // words she uses that you haven't met count as met — they join your reviews
  nw.forEach(id=>{const r=rec(id);if(!r.seen){r.seen++;r.last=Date.now();S.totalNew++;}});
  const msg={who:"her",t:line.t,r:line.r,en:line.en,nw,q:/[？?]$/.test(line.t.trim()),...(opts||{})};
  S.chat.log.push(msg);if(S.chat.log.length>60)S.chat.log=S.chat.log.slice(-60);save();
  return msg;
}
function herOpener(){
  const t=pickTopic();S.chat.used=(S.chat.used||[]).concat(t.id);
  chat.topic=t;return herSay({...t.her,need:t.need},{topic:t.id});
}
function herReply(ids){
  const t=chat.topic;
  let line=null;
  if(t){for(const o of t.on){if(o.any.some(id=>ids.has(id))){line=o.her;break;}}}
  if(!line){ // fixed pairs: if you said her side of a pair, she answers with the reply
    const p=PAIRS.find(p=>ids.has(p.q));if(p){const it=ITEMS.find(i=>i.id===p.a);line={t:jpText(it),r:roText(it),en:it.en,need:[p.a]};}
  }
  if(!line&&t)line=t.else;
  if(!line){const it=ITEMS.find(i=>i.id===shuffle(REACTION_POOL)[0]);line={t:jpText(it),r:roText(it),en:it.en,need:[it.id]};}
  chat.topic=null;
  return herSay(line);
}

/* ---------- Claude API (optional) ---------- */
function knownVocabList(){
  return seenIds().map(i=>`${jpText(i)} (${roText(i)}) = ${i.en}`).join("\n");
}
function chatSystemPrompt(){
  return `You are David's Japanese girlfriend texting him on LINE. You are warm, playful, a little teasing, and you keep the conversation going. He is an Australian snowboard instructor living in Queenstown, NZ, learning Japanese to talk with you.

RULES FOR YOUR JAPANESE
- Casual spoken Japanese, hiragana/katakana ONLY (no kanji), with a space between words exactly like this: "きょう なに する？".
- Short: one or two short sentences per message. Usually end with a question so he has something to answer.
- Stick almost entirely to the phrases and words in his KNOWN list below. You may add at most ONE new word per message, and only when needed.
- Never lecture. Never switch to English in your Japanese text.

KNOWN PHRASES (everything he has learnt so far):
${knownVocabList()||"(nothing yet — use only the very simplest greetings)"}

ALWAYS respond with a single JSON object and nothing else, shape:
{"you":{"en":"natural English translation of what he wrote","parts":[{"t":"japanese chunk","r":"romaji","g":"literal meaning"}],"ok":true,"fix":"short note if his Japanese was off, else empty"},
 "her":{"t":"your reply in japanese","r":"romaji of your reply","en":"english translation","nw":[{"t":"new word","r":"romaji","en":"meaning"}]}}
If he wrote in English (marked ENGLISH), "you" instead becomes a translation INTO Japanese he could send: {"t":"japanese","r":"romaji","en":"the english","parts":[...],"note":"one-line breakdown of the grammar/word choice, using his known phrases where possible","alts":[{"t":"...","r":"..."}]} and "her" is omitted.`;
}
async function callClaude(messages){
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
    "content-type":"application/json","x-api-key":apiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:apiModel(),max_tokens:600,system:chatSystemPrompt(),messages})});
  if(!res.ok)throw new Error("API "+res.status+": "+(await res.text()).slice(0,200));
  const data=await res.json();
  const txt=(data.content||[]).map(c=>c.text||"").join("");
  const m=txt.match(/\{[\s\S]*\}/);if(!m)throw new Error("No JSON in reply");
  return JSON.parse(m[0]);
}
function historyForApi(extra){
  const msgs=[];
  S.chat.log.slice(-16).forEach(m=>{
    if(m.who==="her")msgs.push({role:"assistant",content:JSON.stringify({her:{t:m.t,r:m.r,en:m.en}})});
    else if(m.who==="you")msgs.push({role:"user",content:m.t});
  });
  // merge consecutive same-role turns & make sure it starts with user
  const out=[];msgs.forEach(m=>{const l=out[out.length-1];if(l&&l.role===m.role)l.content+="\n"+m.content;else out.push(m);});
  if(out.length&&out[0].role==="assistant")out.unshift({role:"user",content:"(start of chat)"});
  if(extra)out.push({role:"user",content:extra});
  return out;
}

/* ---------- screen ---------- */
function chatHome(){
  chat={mode:S.chat.mode||"jp",busy:false,topic:null,xl:null};
  if(!S.chat.log.length)chat.topic=null;
  // resume the topic of her last unanswered question, if any
  const last=S.chat.log[S.chat.log.length-1];
  if(last&&last.who==="her"&&last.topic)chat.topic=CHAT_TOPICS.find(t=>t.id===last.topic)||null;
  renderChat();
  if(!S.chat.log.length)herTyping(()=>{herOpener();renderChat();});
}
function chatTop(){
  const live=!!apiKey();
  return `<div class="topbar" style="margin-bottom:12px"><button class="xbtn" onclick="home()">‹</button>
    <div style="flex:1"><div class="lbl acc">💬 HER</div><div style="font-size:11px;color:var(--dim);margin-top:2px">${live?"free chat · Claude":"scripted from your phrases"}</div></div>
    <span class="pill ${live?'live':''}" onclick="chatSettings()" style="cursor:pointer">${live?"● live":"○ offline"}</span>
    <button class="xbtn" onclick="chatSettings()" title="settings">⚙</button></div>`;
}
function chatBubble(m,idx){
  if(m.who==="sys")return `<div class="cbwrap sys"><div class="cbubble"><div class="sub" style="font-size:12px;text-align:center">${m.html}</div></div></div>`;
  const show=m.reveal!==undefined?m.reveal:S.chat.show;
  const cls=(show<1?" hideRo":"")+(show<2?" hideEn":"");
  const you=m.who==="you";
  const chips=(m.nw||[]).map(id=>{const it=typeof id==="string"?ITEMS.find(x=>x.id===id):null;
    if(it)return `<span class="nwchip"><b>${esc(jpText(it))}</b> ${esc(roText(it))} — ${esc(it.en)}</span>`;
    if(id&&id.t)return `<span class="nwchip"><b>${esc(id.t)}</b> ${esc(id.r||"")} — ${esc(id.en||"")}</span>`;return "";}).join("");
  let body;
  if(you){
    body=`<div class="cjp raw">${esc(m.t)}</div>`+(m.en?`<div class="cen">${esc(m.en)}</div>`:"")+(m.segs?segsHTML(m.segs):"")+(m.parts?`<div class="segs">${m.parts.map(p=>`<span class="seg"><b>${esc(p.t)}</b> <span class="sr">${esc(p.r||"")}</span> — ${esc(p.g||"")}</span>`).join("")}</div>`:"")+(m.fix?`<div class="fixnote">✎ ${esc(m.fix)}</div>`:"");
  }else{
    body=`<div class="cjp">${esc(m.t)}</div><div class="cro">${esc(m.r)}</div><div class="cen">${esc(m.en)}</div>`;
  }
  return `<div class="cbwrap ${you?'you':'them'}${you?'':cls}" data-i="${idx}"><div class="cbname">${you?"You":"Her"}</div>
    <div class="cbubble" onclick="chatReveal(${idx})">${body}</div>${chips?`<div class="nwrow">${chips}</div>`:""}</div>`;
}
function chatReveal(i){const m=S.chat.log[i];if(!m||m.who!=="her")return;
  const cur=m.reveal!==undefined?m.reveal:S.chat.show;m.reveal=cur>=2?0:cur+1;save();renderChat(true);}
function cycleShow(){S.chat.show=(S.chat.show+1)%3;S.chat.log.forEach(m=>delete m.reveal);save();renderChat(true);}
function setMode(m){chat.mode=m;S.chat.mode=m;chat.xl=null;save();renderChat(true);setTimeout(()=>{const el=$("cin");if(el)el.focus();},50);}
function renderChat(keepInput){
  const val=keepInput&&$("cin")?$("cin").value:"";
  const log=S.chat.log.map(chatBubble).join("");
  const showLbl=["JP ONLY","JP + ROMAJI","FULL"][S.chat.show];
  const en=chat.mode==="en";
  let xl="";
  if(chat.xl){const x=chat.xl;
    xl=`<div class="xlate fade"><div class="lbl" style="margin-bottom:8px;color:var(--acc2)">${x.weak?"CLOSEST I CAN BUILD":x.partial?"PART OF IT":"IN JAPANESE"}</div>
      <div class="xjp">${esc(x.t)}</div><div class="xro">${esc(x.r)}</div><div class="xen">${esc(x.en)}</div>
      ${x.parts&&x.parts.length?`<div class="segs">${x.parts.map(p=>`<span class="seg"><b>${esc(p.t)}</b> <span class="sr">${esc(p.r||"")}</span> — ${esc(p.g||"")}</span>`).join("")}</div>`:""}
      ${x.note?`<div class="xnote">${x.note}</div>`:""}
      ${x.alts&&x.alts.length?`<div class="lbl mt12" style="font-size:9px">OR MAYBE</div><div class="xalts">${x.alts.map((a,k)=>`<button class="xalt" onclick="useAlt(${k})">${esc(a.t)}<small>${esc(a.r)}</small></button>`).join("")}</div>`:""}
      <div class="xbtns"><button class="btn primary" onclick="sendXl()">SEND THIS ▸</button><button class="btn ghost" onclick="editXl()">EDIT IT</button></div></div>`;
  }
  app.innerHTML=`<div class="chatwrap">${chatTop()}
    <div class="chatlog" id="clog">${log||""}${chat.busy?`<div class="cbwrap them"><div class="cbname">Her</div><div class="cbubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`:""}</div>
    <div class="composer">${xl}
      <div class="modes">
        <button class="mbtn pink ${en?'':'on'}" onclick="setMode('jp')">日本語</button>
        <button class="mbtn ${en?'on':''}" onclick="setMode('en')">English → 日本語</button>
        <button class="mbtn push" onclick="cycleShow()">${showLbl}</button>
      </div>
      <div class="crow"><textarea id="cin" class="cinput ${en?'en':''}" rows="1" placeholder="${en?"Type what you want to say in English…":"にほんご で かいて… (romaji works too)"}" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend();}"></textarea>
        <button class="sendbtn ${en?'blue':''}" onclick="chatSend()" ${chat.busy?"disabled":""}>${en?"訳":"➤"}</button></div>
      <div class="sub center mt8" style="font-size:11px;color:var(--dim)">${en?"I'll build it from phrases you've learnt and show the breakdown before you send.":"Tap her bubbles to peek at the translation · Enter to send"}</div>
    </div></div>`;
  if(keepInput&&val)$("cin").value=val;
  window.scrollTo(0,document.body.scrollHeight);
}
function herTyping(fn,ms){chat.busy=true;renderChat(true);setTimeout(()=>{chat.busy=false;fn();},ms||700+Math.random()*600);}

async function chatSend(){
  const el=$("cin");const raw=(el.value||"").trim();if(!raw||chat.busy)return;
  if(chat.mode==="en"){el.value="";await translateEnglish(raw);return;}
  el.value="";
  const live=!!apiKey();
  if(live){await sendLive(raw);return;}
  sendOffline(raw);
}
function sendOffline(raw){
  const {segs}=segmentInput(raw);
  const ids=idsIn(segs);
  const known=segs.filter(s=>s.known).length;
  const you={who:"you",t:raw,segs,en:known?segsMeaning(segs):"",fix:known?"":"I couldn't match that to anything you've learnt yet — she'll just react. Try the English → 日本語 mode if you're stuck."};
  S.chat.log.push(you);S.chat.sent=(S.chat.sent||0)+1;save();
  // reps: recognised phrases count as a correct recall
  ids.forEach(id=>{const it=ITEMS.find(i=>i.id===id);if(it&&S.items[id]&&S.items[id].seen)grade(id,true,0);});
  renderChat();
  herTyping(()=>{
    const reply=herReply(ids);renderChat();
    if(!reply.q)herTyping(()=>{herOpener();renderChat();},900+Math.random()*900);
  });
}
async function sendLive(raw){
  const you={who:"you",t:raw};S.chat.log.push(you);S.chat.sent=(S.chat.sent||0)+1;save();
  chat.busy=true;renderChat();
  try{
    const out=await callClaude(historyForApi());
    if(out.you){you.en=out.you.en||"";you.parts=out.you.parts||[];you.fix=out.you.fix||"";}
    if(out.her&&out.her.t){S.chat.log.push({who:"her",t:out.her.t,r:out.her.r||"",en:out.her.en||"",nw:out.her.nw||[],q:true});}
    save();
  }catch(e){
    S.chat.log.pop(); // drop your line; the scripted engine re-adds it
    S.chat.log.push({who:"sys",html:`Couldn't reach Claude (${esc(String(e.message||e))}) — scripted reply instead.`});
    chat.busy=false;sendOffline(raw);return;
  }
  chat.busy=false;renderChat();
}
async function translateEnglish(raw){
  if(apiKey()){
    chat.busy=true;renderChat();
    try{
      const out=await callClaude(historyForApi("ENGLISH: "+raw));
      const y=out.you||{};
      chat.xl={t:y.t||"",r:y.r||"",en:raw,parts:y.parts||[],note:y.note?esc(y.note):"",alts:(y.alts||[]).map(a=>({t:a.t,r:a.r||""}))};
      chat.busy=false;renderChat();return;
    }catch(e){chat.busy=false;}
  }
  const res=en2jp(raw);
  if(!res){chat.xl={t:"—",r:"",en:raw,parts:[],note:"Nothing you've learnt says that yet. Say it simpler — or say something else: <b>そうなんだ</b> (I see) and <b>へえ〜</b> (huh) keep any chat alive.",alts:[]};renderChat();return;}
  const parts=[];res.pieces.forEach(it=>it.tok.forEach(t=>{if(!/^[?？!！]/.test(t.t.trim()))parts.push({t:t.t,r:t.r,g:t.g});}));
  const jp=res.pieces.map(jpText).map(t=>/[？?！!]$/.test(t)?t:t+"。").join("").replace(/。$/,"");
  const miss=res.missing&&res.missing.length?`<b>No phrase yet for:</b> ${esc(res.missing.join(", "))}. `:"";
  chat.xl={t:jp,r:res.pieces.map(roText).join(" / "),en:res.pieces.map(i=>i.en).join(" / "),parts,
    note:miss+(res.partial?"I could only build part of that. ":"")+(res.weak?"Loose match — this is the nearest phrase you know. ":"")+(res.note||""),
    alts:res.alts.map(a=>({t:jpText(a),r:roText(a)})),raw};
  renderChat();
}
function useAlt(k){const a=chat.xl.alts[k];const it=ITEMS.find(i=>jpText(i)===a.t);
  chat.xl={t:a.t,r:a.r,en:it?it.en:chat.xl.en,parts:it?it.tok.filter(t=>!/^[?？!！]/.test(t.t.trim())).map(t=>({t:t.t,r:t.r,g:t.g})):[],note:it?it.mn:"",alts:chat.xl.alts.filter((_,i)=>i!==k)};renderChat();}
function sendXl(){const x=chat.xl;if(!x||!x.t||x.t==="—")return;chat.xl=null;chat.mode="jp";S.chat.mode="jp";
  if(apiKey())sendLive(x.t);else sendOffline(x.t);}
function editXl(){const x=chat.xl;chat.xl=null;chat.mode="jp";S.chat.mode="jp";renderChat();const el=$("cin");if(el&&x&&x.t!=="—"){el.value=x.t;el.focus();}}

function chatSettings(){
  const k=apiKey();
  app.innerHTML=`<div class="fade">
    <div class="topbar"><button class="xbtn" onclick="chatHome()">‹</button><div style="flex:1"><div class="lbl acc">CHAT SETTINGS</div></div></div>
    <div class="h1">Make her real.</div>
    <div class="sub mt8">Out of the box she texts from a script built on the phrases you've met. Add a Claude API key and she becomes free-form — anything you type gets properly translated and broken down, and she still sticks to what you've learnt.</div>
    <div class="card mt20"><div class="lbl">CLAUDE API KEY</div>
      <div class="keyrow"><input id="keyin" class="keyin" type="password" placeholder="sk-ant-…" value="${esc(k)}"></div>
      <div class="lbl mt16">MODEL</div>
      <div class="keyrow"><input id="modelin" class="keyin" value="${esc(apiModel())}"></div>
      <div class="sub mt12" style="font-size:12px">Stored only in this browser. Calls go straight from this page to Anthropic — nothing else sees the key. Get one at console.anthropic.com.</div>
      <button class="btn primary mt16" onclick="saveKey()">SAVE</button>
      ${k?`<button class="btn ghost mt12" onclick="localStorage.removeItem('${CHAT_KEY_STORE}');chatSettings()">REMOVE KEY · BACK TO OFFLINE</button>`:""}
    </div>
    <div class="card mt16"><div class="lbl">THIS CHAT</div>
      <div class="sub mt8" style="font-size:13px">${S.chat.log.filter(m=>m.who==="you").length} messages from you in the current thread · ${S.chat.sent||0} sent all-time.</div>
      <button class="btn ghost mt12" onclick="if(confirm('Clear the conversation?')){S.chat.log=[];S.chat.used=[];save();chatHome();}">START A NEW CHAT</button>
    </div>
  </div>`;
}
function saveKey(){const k=$("keyin").value.trim(),m=$("modelin").value.trim();
  if(k)localStorage.setItem(CHAT_KEY_STORE,k);else localStorage.removeItem(CHAT_KEY_STORE);
  if(m&&m!==DEFAULT_MODEL)localStorage.setItem(CHAT_MODEL_STORE,m);else localStorage.removeItem(CHAT_MODEL_STORE);
  chatHome();}

/* ================= INIT ================= */
home();

</script>
