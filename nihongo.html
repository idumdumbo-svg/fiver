<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NIHONGO 15</title>
<style>
:root{
  --bg:#060D0C; --card:#0C1A19; --card2:#122A28; --line:#1E403C;
  --txt:#E6FBF6; --sub:#8FB8B1; --dim:#5A7C77;
  --acc:#2BF5C8; --acc2:#0E6B58; --good:#2BF5C8; --warn:#FFC46B; --bad:#FF4B3E;
  --on-acc:#04211B;
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:max(20px,env(safe-area-inset-top)) 20px 40px;display:flex;flex-direction:column}
.hidden{display:none!important}

/* labels & type */
.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
.lbl.acc{color:var(--acc)}
.h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:14px;color:var(--sub);line-height:1.5}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row{display:flex;align-items:center;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between}

/* buttons */
.btn{
  display:block;width:100%;border:none;border-radius:16px;padding:17px 20px;
  font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.02em;
  cursor:pointer;text-align:center;transition:transform .08s,opacity .15s;color:var(--txt);
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:var(--on-acc)}
.btn.blue{background:var(--acc2);color:#fff}
.btn.ghost{background:var(--card2);border:1px solid var(--line)}
.btn.small{padding:12px 16px;font-size:13px;width:auto}
.btn:disabled{opacity:.35;pointer-events:none}

/* progress bar */
.pbar{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;flex:1}
.pbar>div{height:100%;background:var(--acc);border-radius:3px;transition:width .3s ease}

/* stat chips */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
.stat .num{font-size:22px;font-weight:800}
.stat .lbl{font-size:9px;margin-top:4px}

/* JP sentence with word-for-word gloss */
.gloss{display:flex;flex-wrap:wrap;gap:14px 18px;justify-content:center;align-items:flex-end}
.tok{display:flex;flex-direction:column;align-items:center;gap:3px}
.tok .jp{font-size:30px;font-weight:600;line-height:1.15}
.tok .ro{font-size:12px;color:var(--acc2);font-weight:600;letter-spacing:.02em}
.tok .en{font-size:11px;color:var(--sub);border-top:1px solid var(--line);padding-top:3px;margin-top:1px;max-width:110px;text-align:center;line-height:1.3}
.gloss.md .tok .jp{font-size:24px}
.natural{font-size:15px;color:var(--txt);font-weight:600;text-align:center;margin-top:16px}
.natural::before{content:"= ";color:var(--dim);font-weight:400}
.mnem{margin-top:14px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.mnem .emo{font-size:24px;line-height:1}
.mnem .txt{font-size:13px;color:var(--sub);line-height:1.45}
.mnem .txt b{color:var(--txt)}

/* quiz choices */
.choices{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.choice{
  background:var(--card2);border:1px solid var(--line);border-radius:14px;
  padding:15px 16px;font-size:15px;font-weight:600;cursor:pointer;text-align:left;
  color:var(--txt);font-family:inherit;transition:border-color .15s,background .15s;width:100%;
}
.choice:active{transform:scale(.98)}
.choice.right{border-color:var(--good);background:rgba(62,207,142,.12)}
.choice.wrong{border-color:var(--bad);background:rgba(255,92,92,.12)}
.choice .cr{font-size:11px;color:var(--sub);font-weight:400;display:block;margin-top:2px}

/* sentence builder */
.pool,.built{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.built{min-height:52px;background:var(--card2);border:1px dashed var(--line);border-radius:14px;padding:10px;margin-bottom:16px;align-items:center}
.chip{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 13px;font-size:18px;font-weight:600;cursor:pointer;color:var(--txt);font-family:inherit;
}
.chip small{display:block;font-size:10px;color:var(--acc2);font-weight:600;text-align:center}
.chip.used{opacity:.2;pointer-events:none}
.built .chip{border-color:var(--acc2)}

/* grades */
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.grades .btn{padding:14px 8px;font-size:13px}
.g-again{background:rgba(255,92,92,.15);border:1px solid var(--bad);color:var(--bad)}
.g-good{background:rgba(77,163,255,.15);border:1px solid var(--acc2);color:var(--acc2)}
.g-easy{background:rgba(62,207,142,.15);border:1px solid var(--good);color:var(--good)}

/* strength dots */
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--card2);border:1px solid var(--line)}
.dots i.on{background:var(--good);border-color:var(--good)}

/* feedback bars */
.fb-row{margin-bottom:14px}
.fb-row .spread{margin-bottom:6px}
.fb-row .name{font-size:13px;font-weight:600}
.fb-row .pct{font-size:12px;color:var(--sub);font-weight:700}

/* misc */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.xbtn{background:var(--card2);border:1px solid var(--line);color:var(--sub);width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;font-family:inherit}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt28{margin-top:28px}
.big-emo{font-size:52px;line-height:1}
.score-ring{font-size:56px;font-weight:800;letter-spacing:-.03em}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:7px;background:var(--card2);border:1px solid var(--line);color:var(--sub)}
.tag.new{color:var(--acc);border-color:rgba(232,85,109,.4)}
.tag.rev{color:var(--acc2);border-color:rgba(77,163,255,.4)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.unit-row{padding:14px 16px;border-bottom:1px solid var(--line)}
.unit-row:last-child{border-bottom:none}
.timer{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.08em;margin-left:auto}

/* illustration (picture match) */
.art{background:var(--card2);border:1px solid var(--line);border-radius:18px;width:160px;height:160px;margin:6px auto 0;display:flex;align-items:center;justify-content:center}
.art svg{width:104px;height:104px}
.art.big{width:190px;height:190px}
.art.big svg{width:124px;height:124px}

/* chat bubble (best response) */
.bubble{background:var(--card2);border:1px solid var(--line);border-radius:16px;border-top-left-radius:5px;padding:15px 18px;max-width:330px;margin:8px auto 0;text-align:left}
.bubble .bjp{font-size:25px;font-weight:600;line-height:1.2}
.bubble .bro{font-size:12px;color:var(--acc2);font-weight:600;margin-top:4px}
.bubble .ben{font-size:12px;color:var(--sub);margin-top:7px;font-style:italic}
.bubble-who{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-bottom:6px}

/* situation card (situation match) */
.situation{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:20px 18px;font-size:16px;font-weight:600;text-align:center;line-height:1.5;max-width:370px;margin:8px auto 0}
.situation .semo{font-size:34px;display:block;margin-bottom:10px;line-height:1}

/* particle blank (fill the particle) */
.tok .jp.blank{color:var(--acc);border-bottom:3px dashed var(--acc);padding-bottom:2px;min-width:26px;display:inline-block}

/* conversation scenes */
.chat{display:flex;flex-direction:column;gap:14px;margin:14px 0}
.setting-banner{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--sub);text-align:center;line-height:1.5}
.cbwrap{display:flex;flex-direction:column;max-width:84%}
.cbwrap.them{align-self:flex-start;align-items:flex-start}
.cbwrap.you{align-self:flex-end;align-items:flex-end}
.cbname{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 8px 4px}
.cbubble{padding:12px 15px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.cbwrap.them .cbubble{border-top-left-radius:5px}
.cbwrap.you .cbubble{border-top-right-radius:5px;background:rgba(232,85,109,.14);border-color:rgba(232,85,109,.4)}
.cjp{font-size:22px;font-weight:600;line-height:1.28}
.cro{font-size:12px;color:var(--acc2);font-weight:600;margin-top:3px}
.cen{font-size:12px;color:var(--sub);margin-top:5px}
.nwrow{display:flex;flex-wrap:wrap;gap:6px;margin:7px 6px 0}
.nwchip{font-size:11px;background:rgba(232,85,109,.12);border:1px solid rgba(232,85,109,.4);color:var(--txt);border-radius:8px;padding:4px 8px;line-height:1.3}
.nwchip b{color:var(--acc)}
.sfb{font-size:13px;font-weight:600;text-align:center;padding:10px 12px;border-radius:12px;margin:4px 0 2px;line-height:1.45}
.sfb.ok{color:var(--good);background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3)}
.sfb.no{color:var(--warn);background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3)}
.scene-row{padding:15px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:13px}
.scene-row:last-child{border-bottom:none}
.scene-row:active{background:var(--card2)}
.scene-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--good)}
.scene-check.done{border-color:var(--good);background:rgba(62,207,142,.15)}
.mb{margin-bottom:10px}

/* ================= CHAT (texting) ================= */
.chatwrap{display:flex;flex-direction:column;flex:1;min-height:0}
.chatlog{display:flex;flex-direction:column;gap:12px;flex:1;padding-bottom:8px}
.chatlog .cbwrap{max-width:88%}
.chatlog .cbubble{cursor:pointer}
.cbwrap.hideRo .cro,.cbwrap.hideEn .cen{display:none}
.cbwrap .cjp{font-size:20px}
.cbwrap.you .cjp.raw{font-size:17px;font-weight:500}
.cbwrap.sys{align-self:center;max-width:100%}
.cbwrap.sys .cbubble{background:transparent;border:none;padding:4px 0}
.typing{display:inline-flex;gap:4px;padding:6px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:tb 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.segs{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.seg{font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 7px;line-height:1.35;color:var(--sub)}
.seg b{color:var(--txt);font-weight:600}
.seg.unk{border-style:dashed;color:var(--dim)}
.seg .sr{color:var(--acc2);font-weight:600}
.fixnote{font-size:12px;color:var(--warn);margin-top:6px;line-height:1.4}
.composer{position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px;border-top:1px solid var(--line);margin-top:8px}
.crow{display:flex;gap:8px;align-items:flex-end}
.cinput{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:13px 14px;color:var(--txt);font-family:inherit;font-size:17px;resize:none;min-height:50px;max-height:120px;outline:none;line-height:1.35}
.cinput:focus{border-color:var(--acc2)}
.cinput.en{font-size:15px}
.sendbtn{background:var(--acc);color:var(--on-acc);border:none;border-radius:50%;width:50px;height:50px;font-size:20px;cursor:pointer;flex-shrink:0;font-family:inherit;font-weight:800}
.sendbtn.blue{background:var(--acc2);color:#fff}
.sendbtn:disabled{opacity:.35}
.modes{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.mbtn{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--sub);cursor:pointer;font-family:inherit}
.mbtn.on{color:var(--txt);border-color:var(--acc2);background:rgba(77,163,255,.12)}
.mbtn.pink.on{border-color:var(--acc);background:rgba(232,85,109,.12)}
.mbtn.push{margin-left:auto}
.xlate{background:var(--card2);border:1px solid var(--acc2);border-radius:14px;padding:14px;margin-bottom:10px}
.xlate .xjp{font-size:22px;font-weight:600;line-height:1.3}
.xlate .xro{font-size:12px;color:var(--acc2);font-weight:600;margin-top:3px}
.xlate .xen{font-size:12px;color:var(--sub);margin-top:4px}
.xlate .xnote{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.45;border-top:1px solid var(--line);padding-top:9px}
.xlate .xnote b{color:var(--txt)}
.xalts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.xalt{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px;cursor:pointer;color:var(--txt);font-family:inherit}
.xalt small{color:var(--acc2);margin-left:4px}
.xbtns{display:flex;gap:8px;margin-top:12px}
.xbtns .btn{padding:12px}
.keyrow{display:flex;gap:8px;margin-top:10px}
.keyin{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font-family:inherit;font-size:14px;outline:none}
.pill{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:7px;border:1px solid var(--line);color:var(--sub)}
.pill.live{color:var(--good);border-color:rgba(62,207,142,.4)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= DATA =================
   tok: t = japanese, r = romaji, g = literal word-for-word english */
const UNITS=[
{id:1,name:"Daily Rhythm",emo:"🌅",desc:"The phrases that bookend every day together"},
{id:2,name:"Feelings & States",emo:"💭",desc:"Say how you feel — hungry, tired, happy"},
{id:3,name:"Food & Meals",emo:"🍜",desc:"Eating together, the heart of it all"},
{id:4,name:"Plans & Time",emo:"🗓️",desc:"Making plans, meeting up, heading out"},
{id:5,name:"Couple Talk",emo:"❤️",desc:"The sweet stuff"},
{id:6,name:"Understanding",emo:"🙋",desc:"Keep the conversation alive when you're lost"},
{id:7,name:"Texting",emo:"📱",desc:"Everyday messages between you two"},
{id:8,name:"Grammar Bites",emo:"🧩",desc:"Particles — the glue of Japanese"},
{id:9,name:"Out & About",emo:"🏪",desc:"Konbini, trains, shops — surviving on your own"},
{id:10,name:"Small Talk",emo:"💬",desc:"Reactions and filler — the sound of someone who belongs"},
];
const ITEMS=[
/* U1 Daily Rhythm */
{id:"u1a",u:1,tok:[{t:"おはよう",r:"ohayou",g:"good morning"}],en:"Morning!",emo:"🌅",mn:"<b>Ohayou</b> sounds like the state <b>Ohio</b> — wake up in Ohio every morning."},
{id:"u1b",u:1,tok:[{t:"おやすみ",r:"oyasumi",g:"rest [honorific]"}],en:"Good night",emo:"🌙",mn:"<b>Yasumi</b> = rest/holiday. o-yasumi = 'have an honourable rest'."},
{id:"u1c",u:1,tok:[{t:"ただいま",r:"tadaima",g:"just-now [I'm back]"}],en:"I'm home!",emo:"🏠",mn:"Literally '<b>just now</b>' — as in 'I just now got back'. Shout it walking in the door."},
{id:"u1d",u:1,tok:[{t:"おかえり",r:"okaeri",g:"return [welcome]"}],en:"Welcome home",emo:"🫶",mn:"From <b>kaeru</b> (to return). The auto-reply to tadaima — they're a pair."},
{id:"u1e",u:1,tok:[{t:"いってきます",r:"ittekimasu",g:"go-and-come"}],en:"I'm off! (I'll go and come back)",emo:"🚪",mn:"<b>Itte</b> (go) + <b>kimasu</b> (come) — 'I go and I'll come back'. Said when leaving home."},
{id:"u1f",u:1,tok:[{t:"いってらっしゃい",r:"itterasshai",g:"go-and-come [to you]"}],en:"See you later, take care",emo:"👋",mn:"The reply to ittekimasu — 'go and come back safely'. Another fixed pair."},
{id:"u1g",u:1,tok:[{t:"おつかれさま",r:"otsukaresama",g:"honourable-tiredness"}],en:"Good work today / you must be tired",emo:"🎿",mn:"From <b>tsukareta</b> (tired). You'll hear this constantly at ski resorts after work."},
/* U2 Feelings */
{id:"u2a",u:2,tok:[{t:"おなか",r:"onaka",g:"stomach"},{t:"すいた",r:"suita",g:"emptied"}],en:"I'm hungry",emo:"🍙",mn:"Stomach emptied. Japanese says <b>what happened to the stomach</b>, not 'I am hungry'."},
{id:"u2b",u:2,tok:[{t:"のど",r:"nodo",g:"throat"},{t:"かわいた",r:"kawaita",g:"dried"}],en:"I'm thirsty",emo:"🥤",mn:"Throat dried — same pattern as onaka suita."},
{id:"u2c",u:2,tok:[{t:"ねむい",r:"nemui",g:"sleepy"}],en:"I'm sleepy",emo:"😴",mn:"<b>Nemui</b> — imagine a sleepy cat going 'nemu nemu'. Japanese actually uses this!"},
{id:"u2d",u:2,tok:[{t:"つかれた",r:"tsukareta",g:"got-tired"}],en:"I'm tired / worn out",emo:"🥱",mn:"Past tense — 'I <b>became</b> tired'. The root of otsukaresama."},
{id:"u2e",u:2,tok:[{t:"さむい",r:"samui",g:"cold"}],en:"It's cold / I'm cold",emo:"❄️",mn:"<b>Samui</b> — you'll say this every day on the hill. 'Sam, oui, it's cold.'"},
{id:"u2f",u:2,tok:[{t:"あつい",r:"atsui",g:"hot"}],en:"It's hot / I'm hot",emo:"🔥",mn:"<b>Atsui!</b> — what you say touching hot ramen. 'Ah! Too-ee hot!'"},
{id:"u2g",u:2,tok:[{t:"うれしい",r:"ureshii",g:"happy/glad"}],en:"I'm happy",emo:"😊",mn:"<b>Ureshii</b> = happy about something that happened (not general happiness)."},
{id:"u2h",u:2,tok:[{t:"げんき",r:"genki",g:"energy/well"},{t:"？",r:"?",g:"?"}],en:"You doing good?",emo:"⚡",mn:"<b>Genki</b> = energy, liveliness. Rising tone makes it a question — no extra words needed."},
{id:"u2i",u:2,tok:[{t:"だいじょうぶ",r:"daijoubu",g:"okay/alright"},{t:"？",r:"?",g:"?"}],en:"You okay?",emo:"🤕",mn:"Works as question AND answer: 'Daijoubu?' 'Daijoubu!' — you okay? / I'm fine."},
/* U3 Food */
{id:"u3a",u:3,tok:[{t:"なに",r:"nani",g:"what"},{t:"たべたい",r:"tabetai",g:"want-to-eat"},{t:"？",r:"?",g:"?"}],en:"What do you want to eat?",emo:"🍽️",mn:"<b>Tabe</b> (eat) + <b>tai</b> (want to). ~tai turns any verb into a want. No 'do you' needed."},
{id:"u3b",u:3,tok:[{t:"おいしい",r:"oishii",g:"delicious"},{t:"！",r:"!",g:"!"}],en:"Delicious!",emo:"😋",mn:"Say it with feeling mid-bite. The single most useful word at her family's dinner table."},
{id:"u3c",u:3,tok:[{t:"いただきます",r:"itadakimasu",g:"[I] humbly-receive"}],en:"Said before eating — 'let's eat'",emo:"🙏",mn:"Hands together before the meal. Literally 'I humbly receive (this food/life)'."},
{id:"u3d",u:3,tok:[{t:"ごちそうさま",r:"gochisousama",g:"[it was a] feast"}],en:"Said after eating — 'thanks for the meal'",emo:"🍵",mn:"The closing bracket to itadakimasu. Skipping it is like leaving without saying thanks."},
{id:"u3e",u:3,tok:[{t:"これ",r:"kore",g:"this"},{t:"たべて",r:"tabete",g:"eat-and"},{t:"みて",r:"mite",g:"try/see"}],en:"Try eating this",emo:"🥢",mn:"<b>~te mite</b> = 'do and see' = try it. Kore/sore/are = this/that/that-over-there."},
{id:"u3f",u:3,tok:[{t:"おなか",r:"onaka",g:"stomach"},{t:"いっぱい",r:"ippai",g:"full"}],en:"I'm full",emo:"🫃",mn:"<b>Ippai</b> = full / lots. Stomach full — big smile, lean back, say it."},
{id:"u3g",u:3,tok:[{t:"コーヒー",r:"koohii",g:"coffee"},{t:"のむ",r:"nomu",g:"drink"},{t:"？",r:"?",g:"?"}],en:"Want a coffee?",emo:"☕",mn:"Katakana loan-word: <b>koohii</b>. Casual Japanese drops everything: 'Coffee, drink?'"},
/* U4 Plans */
{id:"u4a",u:4,tok:[{t:"きょう",r:"kyou",g:"today"},{t:"なに",r:"nani",g:"what"},{t:"する",r:"suru",g:"do"},{t:"？",r:"?",g:"?"}],en:"What are we doing today?",emo:"📆",mn:"Time word first, then what, then verb LAST. Japanese verbs always land at the end."},
{id:"u4b",u:4,tok:[{t:"あした",r:"ashita",g:"tomorrow"},{t:"ひま",r:"hima",g:"free-time"},{t:"？",r:"?",g:"?"}],en:"You free tomorrow?",emo:"🗓️",mn:"<b>Hima</b> = free / nothing on. Two words = a full invitation."},
{id:"u4c",u:4,tok:[{t:"いこう",r:"ikou",g:"let's-go"},{t:"！",r:"!",g:"!"}],en:"Let's go!",emo:"🏂",mn:"<b>Iku</b> (go) → <b>ikou</b> (let's go). The ~ou ending = 'let's'. Tabeyou = let's eat."},
{id:"u4d",u:4,tok:[{t:"ちょっと",r:"chotto",g:"a-little"},{t:"まって",r:"matte",g:"wait"}],en:"Wait a sec",emo:"✋",mn:"<b>Chotto</b> is the Swiss army knife word — 'a little', 'hang on', even a soft 'no'."},
{id:"u4e",u:4,tok:[{t:"また",r:"mata",g:"again"},{t:"あした",r:"ashita",g:"tomorrow"}],en:"See you tomorrow",emo:"🌄",mn:"Literally 'again tomorrow'. Mata ne = 'again, yeah?' = see ya."},
{id:"u4f",u:4,tok:[{t:"なんじ",r:"nanji",g:"what-hour"},{t:"に",r:"ni",g:"at"},{t:"あう",r:"au",g:"meet"},{t:"？",r:"?",g:"?"}],en:"What time shall we meet?",emo:"⌚",mn:"<b>Nan</b> (what) + <b>ji</b> (o'clock). <b>Ni</b> pins the time: 3じに = at 3."},
{id:"u4g",u:4,tok:[{t:"スキー",r:"sukii",g:"ski"},{t:"いこう",r:"ikou",g:"let's-go"},{t:"！",r:"!",g:"!"}],en:"Let's go skiing!",emo:"⛷️",mn:"Snowboard = スノボ (<b>sunobo</b>). Sunobo ikou! — your most-used sentence in Japan."},
/* U5 Couple */
{id:"u5a",u:5,tok:[{t:"すき",r:"suki",g:"like"},{t:"だよ",r:"da yo",g:"is [I tell you]"}],en:"I like you",emo:"💘",mn:"<b>Suki</b> = like/love. No 'I' or 'you' — context carries it. <b>Yo</b> adds warmth: 'y'know'."},
{id:"u5b",u:5,tok:[{t:"だいすき",r:"daisuki",g:"big-like"}],en:"I love you (lots)",emo:"❤️",mn:"<b>Dai</b> (big) + <b>suki</b> (like) = big like = love. Dai-jou-bu uses the same 'dai'."},
{id:"u5c",u:5,tok:[{t:"あいたい",r:"aitai",g:"want-to-meet"}],en:"I miss you / I want to see you",emo:"🥺",mn:"<b>Au</b> (meet) + <b>tai</b> (want). Japanese has no 'miss you' — you say 'want to meet'."},
{id:"u5d",u:5,tok:[{t:"かわいい",r:"kawaii",g:"cute"}],en:"Cute!",emo:"🐣",mn:"Careful: kawa<b>ii</b> = cute, kowai = scary. One vowel between a compliment and an insult."},
{id:"u5e",u:5,tok:[{t:"いっしょ",r:"issho",g:"together"},{t:"に",r:"ni",g:"in/with"},{t:"いよう",r:"iyou",g:"let's-be"}],en:"Let's stay together",emo:"🤝",mn:"<b>Issho ni</b> = together. Add to anything: issho ni tabeyou = let's eat together."},
{id:"u5f",u:5,tok:[{t:"ぎゅって",r:"gyutte",g:"squeeze [sound]"},{t:"して",r:"shite",g:"do [for me]"}],en:"Hug me",emo:"🤗",mn:"<b>Gyu</b> is the squeezing sound-effect. Japanese loves sound words — 'do a squeeze'."},
{id:"u5g",u:5,tok:[{t:"がんばって",r:"ganbatte",g:"do-your-best"}],en:"Good luck / you've got this",emo:"💪",mn:"What she'll text you before your exam. Reply: <b>ganbaru!</b> (I'll do my best!)."},
{id:"u5h",u:5,tok:[{t:"ありがとう",r:"arigatou",g:"thanks"},{t:"ね",r:"ne",g:"[softener] yeah"}],en:"Thanks, hey",emo:"😊",mn:"<b>Ne</b> at the end softens and connects — like ending with 'yeah?' or 'eh' in NZ."},
/* U6 Understanding */
{id:"u6a",u:6,tok:[{t:"これ",r:"kore",g:"this"},{t:"は",r:"wa",g:"[topic]"},{t:"なに",r:"nani",g:"what"},{t:"？",r:"?",g:"?"}],en:"What's this?",emo:"👀",mn:"は is read <b>wa</b> when it's the topic particle. 'This-as-topic: what?'"},
{id:"u6b",u:6,tok:[{t:"わからない",r:"wakaranai",g:"not-understand"}],en:"I don't understand",emo:"🤷",mn:"<b>Wakaru</b> (understand) → <b>wakaranai</b> (not). ~nai = negative for most verbs."},
{id:"u6c",u:6,tok:[{t:"もう",r:"mou",g:"more/again"},{t:"いっかい",r:"ikkai",g:"one-time"},{t:"いって",r:"itte",g:"say"}],en:"Say it one more time",emo:"🔁",mn:"<b>Mou ikkai</b> = one more time — also what you say wanting another run on the hill."},
{id:"u6d",u:6,tok:[{t:"にほんご",r:"nihongo",g:"Japan-language"},{t:"で",r:"de",g:"by-means-of"},{t:"なんて",r:"nante",g:"what [quote]"},{t:"いう",r:"iu",g:"say"},{t:"？",r:"?",g:"?"}],en:"How do you say it in Japanese?",emo:"🗣️",mn:"Your learning superpower — ask her this 10 times a day. <b>De</b> = 'using/by'."},
{id:"u6e",u:6,tok:[{t:"ゆっくり",r:"yukkuri",g:"slowly"},{t:"おねがい",r:"onegai",g:"please/request"}],en:"Slowly, please",emo:"🐢",mn:"<b>Yukkuri</b> = slowly/relaxed. Also great teaching Japanese kids to turn: yukkuri~!"},
{id:"u6f",u:6,tok:[{t:"そう",r:"sou",g:"that-way"},{t:"だ",r:"da",g:"is"},{t:"ね",r:"ne",g:"right?"}],en:"Yeah, that's right",emo:"👍",mn:"The universal agreement noise. <b>Sou sou sou</b> = yes yes exactly."},
{id:"u6g",u:6,tok:[{t:"ほんとう",r:"hontou",g:"truth"},{t:"に",r:"ni",g:"[adverb]"},{t:"？",r:"?",g:"?"}],en:"Really?!",emo:"😲",mn:"<b>Hontou ni?</b> — react to any story with this and you sound instantly fluent."},
/* U7 Texting */
{id:"u7a",u:7,tok:[{t:"いま",r:"ima",g:"now"},{t:"なに",r:"nani",g:"what"},{t:"してる",r:"shiteru",g:"doing"},{t:"？",r:"?",g:"?"}],en:"What are you doing right now?",emo:"📱",mn:"<b>Shiteru</b> = shortened 'shite iru' (is doing). Texting Japanese drops every extra sound."},
{id:"u7b",u:7,tok:[{t:"はやく",r:"hayaku",g:"quickly/soon"},{t:"あいたい",r:"aitai",g:"want-to-meet"}],en:"Can't wait to see you",emo:"💨",mn:"<b>Hayai</b> (fast) → <b>hayaku</b> (quickly). 'Soon want-to-meet' = can't wait."},
{id:"u7c",u:7,tok:[{t:"りょうかい",r:"ryoukai",g:"understood/roger"}],en:"Got it / roger",emo:"🫡",mn:"The texting 'OK'. Often typed as りょ (ryo) — Japanese text-speak for 'k'."},
{id:"u7d",u:7,tok:[{t:"いい",r:"ii",g:"good"},{t:"ゆめ",r:"yume",g:"dream"},{t:"みて",r:"mite",g:"see"},{t:"ね",r:"ne",g:"okay?"}],en:"Sweet dreams",emo:"🌠",mn:"'See a good dream, yeah?' In Japanese you <b>see</b> dreams, you don't have them."},
{id:"u7e",u:7,tok:[{t:"ごめん",r:"gomen",g:"sorry"},{t:"、しごと",r:"shigoto",g:"work"},{t:"ちゅう",r:"chuu",g:"in-the-middle-of"}],en:"Sorry, I'm at work",emo:"🎿",mn:"<b>~chuu</b> = mid-something. Ressun-chuu = mid-lesson. Your go-to on-hill reply."},
{id:"u7f",u:7,tok:[{t:"あとで",r:"ato de",g:"later at"},{t:"でんわ",r:"denwa",g:"phone [electric-talk]"},{t:"する",r:"suru",g:"do"}],en:"I'll call you later",emo:"📞",mn:"<b>Denwa</b> = electric (den) + talk (wa). 'Later, phone do.' Verb last, always."},
/* U8 Grammar */
{id:"u8a",u:8,tok:[{t:"わたし",r:"watashi",g:"I"},{t:"は",r:"wa",g:"[topic]"},{t:"デイビッド",r:"Deibiddo",g:"David"}],en:"I'm David",emo:"🙋",mn:"<b>Wa</b> marks the topic: 'As for me — David.' No word for 'am' needed in casual talk."},
{id:"u8b",u:8,tok:[{t:"コーヒー",r:"koohii",g:"coffee"},{t:"を",r:"o",g:"[object]"},{t:"のむ",r:"nomu",g:"drink"}],en:"(I) drink coffee",emo:"☕",mn:"<b>を (o)</b> tags what the verb acts on. Coffee ← drink. Spoken Japanese often drops it."},
{id:"u8c",u:8,tok:[{t:"やま",r:"yama",g:"mountain"},{t:"に",r:"ni",g:"to"},{t:"いく",r:"iku",g:"go"}],en:"(I'm) going to the mountain",emo:"🏔️",mn:"<b>Ni</b> = destination arrow. Yama ni iku — where every winter morning starts."},
{id:"u8d",u:8,tok:[{t:"ゆき",r:"yuki",g:"snow"},{t:"が",r:"ga",g:"[subject]"},{t:"すき",r:"suki",g:"liked"}],en:"I like snow",emo:"⛄",mn:"With suki, the loved thing takes <b>ga</b>: 'snow is-liked (by me)'. Yuki ga suki!"},
{id:"u8e",u:8,tok:[{t:"これ",r:"kore",g:"this"},{t:"は",r:"wa",g:"[topic]"},{t:"わたし",r:"watashi",g:"me"},{t:"の",r:"no",g:"of/'s"}],en:"This is mine",emo:"🎒",mn:"<b>No</b> = possessive 's. Watashi no = mine. Kanojo no sunobo = her snowboard."},
/* ---- NEW BATCH ---- */
/* U1 Daily Rhythm */
{id:"u1h",u:1,tok:[{t:"また",r:"mata",g:"again"},{t:"あとで",r:"ato de",g:"later"}],en:"See you later",emo:"👋",mn:"<b>Mata</b> (again) + <b>ato de</b> (later). Casual sign-off between two people who'll see each other again soon."},
{id:"u1i",u:1,tok:[{t:"おはよう",r:"ohayou",g:"good morning"},{t:"ございます",r:"gozaimasu",g:"[polite]"}],en:"Good morning (polite)",emo:"🙇",mn:"Add <b>gozaimasu</b> to make it polite — this is the version for the resort, her parents, guests."},
/* U2 Feelings */
{id:"u2j",u:2,tok:[{t:"つめたい",r:"tsumetai",g:"cold [to touch]"}],en:"It's cold (to touch)",emo:"🧊",mn:"<b>Tsumetai</b> = cold to the touch (hands, snow, a drink). <b>Samui</b> = cold air/weather. Don't mix them up."},
{id:"u2k",u:2,tok:[{t:"きもちいい",r:"kimochii",g:"feels-good"}],en:"Feels good",emo:"☺️",mn:"<b>Kimochi</b> (feeling) + <b>ii</b> (good). Hot spring, sun on the deck, a good carve — kimochii!"},
{id:"u2l",u:2,tok:[{t:"こわい",r:"kowai",g:"scary"}],en:"That's scary",emo:"😱",mn:"The trap word: <b>kowai</b> = scary, <b>kawaii</b> = cute. One vowel apart — say it wrong and you've called her scary."},
{id:"u2m",u:2,tok:[{t:"いそがしい",r:"isogashii",g:"busy"}],en:"I'm busy",emo:"🌀",mn:"<b>Isogashii</b> — a mouthful, but you'll need it. 'I-so-ga-shii.' The reason you can't text back on a powder day."},
/* U3 Food */
{id:"u3h",u:3,tok:[{t:"さきに",r:"saki ni",g:"first/ahead"},{t:"たべて",r:"tabete",g:"eat"}],en:"Go ahead and eat",emo:"🍚",mn:"<b>Saki ni</b> = ahead / first. Tell her not to wait for you — saki ni tabete."},
{id:"u3i",u:3,tok:[{t:"おかわり",r:"okawari",g:"refill/seconds"}],en:"Seconds, please",emo:"🍚",mn:"<b>Okawari</b> = another serving. The word that makes any Japanese mum happy. Hold your bowl out."},
{id:"u3j",u:3,tok:[{t:"からい",r:"karai",g:"spicy"}],en:"It's spicy",emo:"🌶️",mn:"<b>Karai</b> = spicy/hot-taste. Not atsui (temperature). Careful: karai vs karui (light) — one vowel again."},
{id:"u3k",u:3,tok:[{t:"みず",r:"mizu",g:"water"},{t:"ください",r:"kudasai",g:"please-give"}],en:"Water, please",emo:"💧",mn:"<b>Kudasai</b> = please give me. Attach to any noun: koohii kudasai, mizu kudasai."},
/* U4 Plans */
{id:"u4h",u:4,tok:[{t:"たのしみ",r:"tanoshimi",g:"looking-forward"}],en:"Can't wait / looking forward to it",emo:"🤩",mn:"From <b>tanoshii</b> (fun). Tanoshimi! = I'm looking forward to it. Sukii tanoshimi!"},
{id:"u4i",u:4,tok:[{t:"むり",r:"muri",g:"impossible/can't"}],en:"No way / I can't",emo:"🙅",mn:"<b>Muri</b> = impossible, can't do it. Soft refusal: 'Ashita? Muri~.' Very common, very casual."},
{id:"u4j",u:4,tok:[{t:"どこ",r:"doko",g:"where"},{t:"いく",r:"iku",g:"go"},{t:"？",r:"?",g:"?"}],en:"Where shall we go?",emo:"🧭",mn:"<b>Doko</b> = where. Doko / dare / nani = where / who / what. Verb last: doko iku?"},
/* U5 Couple */
{id:"u5i",u:5,tok:[{t:"だいじに",r:"daiji ni",g:"take-care"},{t:"ね",r:"ne",g:"okay?"}],en:"Take care of yourself",emo:"🤒",mn:"<b>Daiji</b> = precious/important. Daiji ni = treat yourself as precious. Say it when she's sick or cold."},
{id:"u5j",u:5,tok:[{t:"いつも",r:"itsumo",g:"always"},{t:"ありがとう",r:"arigatou",g:"thanks"}],en:"Thanks for everything, always",emo:"🥰",mn:"<b>Itsumo</b> = always. The upgrade from a plain arigatou — the one that lands."},
/* U6 Understanding */
{id:"u6h",u:6,tok:[{t:"だれ",r:"dare",g:"who"},{t:"？",r:"?",g:"?"}],en:"Who?",emo:"🕵️",mn:"<b>Dare</b> = who. Dare to nani no koto? — don't dare confuse it with 'dare' in English."},
{id:"u6i",u:6,tok:[{t:"どういう",r:"dou iu",g:"what-kind"},{t:"いみ",r:"imi",g:"meaning"},{t:"？",r:"?",g:"?"}],en:"What does it mean?",emo:"❓",mn:"<b>Imi</b> = meaning. Dou iu imi? = 'what kind of meaning?' Your other daily learning question."},
/* U7 Texting */
{id:"u7g",u:7,tok:[{t:"おそく",r:"osoku",g:"late"},{t:"なる",r:"naru",g:"become"}],en:"I'll be late",emo:"🕗",mn:"<b>Osoi</b> (late) → <b>osoku naru</b> (become late). The 'lift queue was chaos' text."},
{id:"u7h",u:7,tok:[{t:"ついた",r:"tsuita",g:"arrived"},{t:"？",r:"?",g:"?"}],en:"Did you get there?",emo:"📍",mn:"<b>Tsuita</b> = arrived (past). Tsuita? = you there yet? Reply: tsuita yo! (I've arrived!)."},
/* U8 Grammar */
{id:"u8f",u:8,tok:[{t:"わたし",r:"watashi",g:"I"},{t:"も",r:"mo",g:"also"}],en:"Me too",emo:"🙌",mn:"<b>Mo</b> = also/too. Swap it in for wa: 'watashi mo' = me too. Watashi mo suki = I like it too."},
{id:"u8g",u:8,tok:[{t:"さむい",r:"samui",g:"cold"},{t:"から",r:"kara",g:"because"}],en:"Because it's cold",emo:"🧥",mn:"<b>Kara</b> = because/since, and it comes AFTER the reason. Samui kara = 'cold, so...'."},
{id:"u8h",u:8,tok:[{t:"きみ",r:"kimi",g:"you"},{t:"と",r:"to",g:"with/and"},{t:"いっしょ",r:"issho",g:"together"}],en:"Together with you",emo:"🫶",mn:"<b>To</b> = with / and. Kimi to = with you. Kimi to issho ga ii = being with you is good."},
/* ---- WORDS FROM CONVERSATIONS (introduced in scenes) ---- */
{id:"n1",u:4,src:"scene",tok:[{t:"ゲレンデ",r:"gerende",g:"ski slopes"}],en:"the slopes",emo:"⛷️",mn:"A German loanword Japan adopted for the ski runs. <b>Gerende de aou</b> = let's meet on the slopes."},
{id:"n2",u:4,src:"scene",tok:[{t:"リフト",r:"rifuto",g:"chairlift"}],en:"chairlift",emo:"🚠",mn:"English 'lift' in katakana. <b>Rifuto-ken</b> = lift pass — the thing you'll buy every morning."},
{id:"n3",u:2,src:"scene",tok:[{t:"よし",r:"yoshi",g:"alright!"}],en:"Alright! / Let's do this",emo:"✊",mn:"The pump-up grunt before you drop in. <b>Yoshi!</b> — half 'okay', half war-cry."},
{id:"n4",u:2,src:"scene",tok:[{t:"すごい",r:"sugoi",g:"amazing"}],en:"Amazing! / Wow",emo:"🤩",mn:"The all-purpose 'wow'. Snow, food, a trick — <b>sugoi</b> covers all of it."},
{id:"n5",u:2,src:"scene",tok:[{t:"あぶない",r:"abunai",g:"dangerous"}],en:"Watch out! / Dangerous",emo:"⚠️",mn:"Shout it when someone's about to crash — <b>abunai!</b> Also 'that was close'."},
{id:"n6",u:2,src:"scene",tok:[{t:"じょうず",r:"jouzu",g:"skilled"}],en:"Good at it / skilled",emo:"👏",mn:"<b>Jouzu ne!</b> = you're good! The compliment you'll hand out teaching kids all day."},
{id:"n7",u:3,src:"scene",tok:[{t:"たくさん",r:"takusan",g:"a lot"}],en:"A lot / lots",emo:"🍚",mn:"<b>Takusan tabete</b> = eat lots. Think 'tak-san' — a whole stack of it."},
{id:"n8",u:3,src:"scene",tok:[{t:"もっと",r:"motto",g:"more"}],en:"More",emo:"➕",mn:"<b>Motto</b> = more. Motto kudasai = more please. Motto yukkuri = slower."},
{id:"n9",u:3,src:"scene",tok:[{t:"どうぞ",r:"douzo",g:"here you go"}],en:"Here you go / go ahead",emo:"🤲",mn:"Offering something: <b>douzo</b>. The natural pair to arigatou — douzo / doumo."},
{id:"n10",u:5,src:"scene",tok:[{t:"ありがとうございます",r:"arigatou gozaimasu",g:"thank you [polite]"}],en:"Thank you (polite)",emo:"🙏",mn:"The full polite thanks — the version for her parents, resort staff, and guests."},
{id:"n11",u:3,src:"scene",tok:[{t:"ひるごはん",r:"hirugohan",g:"lunch"}],en:"lunch",emo:"🍱",mn:"<b>Hiru</b> (noon) + <b>gohan</b> (meal). Asa-gohan = breakfast, ban-gohan = dinner."},
{id:"n12",u:7,src:"scene",tok:[{t:"おわった",r:"owatta",g:"finished"}],en:"(It's) finished / done",emo:"✅",mn:"<b>Owaru</b> (to end) → <b>owatta</b> (ended). 'Shigoto owatta!' = work's done!"},
{id:"n13",u:6,src:"scene",tok:[{t:"まだ",r:"mada",g:"not yet"}],en:"Not yet / still",emo:"⏳",mn:"<b>Mada?</b> = not yet? <b>Mada.</b> = not yet. The opposite of mou (already)."},
{id:"n14",u:5,src:"scene",tok:[{t:"はじめまして",r:"hajimemashite",g:"nice to meet you"}],en:"Nice to meet you",emo:"🤝",mn:"The first-meeting phrase, from <b>hajime</b> (beginning). Say it with a small bow."},
{id:"n15",u:5,src:"scene",tok:[{t:"よろしく",r:"yoroshiku",g:"[treat me well]"}],en:"Nice to meet you / please be good to me",emo:"🙇",mn:"Untranslatable glue phrase — 'let's get on well from here'. Always follows hajimemashite."},
{id:"n16",u:6,src:"scene",tok:[{t:"まだまだ",r:"madamada",g:"long way to go"}],en:"Still a long way to go",emo:"😅",mn:"The humble reply to a compliment: <b>madamada desu</b> = I'm nowhere near good yet."},
{id:"n17",u:4,src:"scene",tok:[{t:"えいが",r:"eiga",g:"movie"}],en:"movie",emo:"🎬",mn:"<b>Eiga</b> = movie. Eiga mi ni iku = go to see a movie."},
{id:"n18",u:4,src:"scene",tok:[{t:"たのしかった",r:"tanoshikatta",g:"was fun"}],en:"It was fun",emo:"😄",mn:"<b>Tanoshii</b> (fun) → <b>tanoshikatta</b> (was fun). Past of ~i adjectives ends in ~katta."},
{id:"n19",u:6,src:"scene",tok:[{t:"うん",r:"un",g:"yeah"}],en:"Yeah / mm",emo:"🙂",mn:"Casual 'yes' — a nod plus <b>un</b>. The formal version is hai."},

/* ================= EXPANSION 2 ================= */
/* U9 Out & About — shops, konbini, trains, directions */
{id:"u9a",u:9,tok:[{t:"すみません",r:"sumimasen",g:"excuse me/sorry"}],en:"Excuse me / sorry",emo:"🙇",mn:"The most-used word in Japan. Gets attention, apologises, and thanks — all three. Say it walking into any shop."},
{id:"u9b",u:9,tok:[{t:"これ",r:"kore",g:"this"},{t:"ください",r:"kudasai",g:"please-give"}],en:"This one, please",emo:"👉",mn:"Point and say it. <b>Kore kudasai</b> gets you fed, watered and equipped anywhere in Japan without another word."},
{id:"u9c",u:9,tok:[{t:"いくら",r:"ikura",g:"how-much"},{t:"？",r:"?",g:"?"}],en:"How much is it?",emo:"💴",mn:"<b>Ikura</b> = how much. Also salmon roe. Context saves you — nobody thinks you're asking the price of fish eggs."},
{id:"u9d",u:9,tok:[{t:"ぜんぶ",r:"zenbu",g:"all"},{t:"で",r:"de",g:"in-total"},{t:"いくら",r:"ikura",g:"how-much"},{t:"？",r:"?",g:"?"}],en:"How much all together?",emo:"🧾",mn:"<b>Zenbu</b> = everything. <b>De</b> here means 'as a total'. Zenbu de = the whole lot."},
{id:"u9e",u:9,tok:[{t:"トイレ",r:"toire",g:"toilet"},{t:"どこ",r:"doko",g:"where"},{t:"？",r:"?",g:"?"}],en:"Where's the toilet?",emo:"🚻",mn:"The emergency phrase. Two words, no grammar needed. Learn it before anything fancy."},
{id:"u9f",u:9,tok:[{t:"えき",r:"eki",g:"station"},{t:"は",r:"wa",g:"[topic]"},{t:"どこ",r:"doko",g:"where"},{t:"？",r:"?",g:"?"}],en:"Where's the station?",emo:"🚉",mn:"<b>Eki</b> = station. Swap the noun for anything: konbini wa doko? basu-tei wa doko?"},
{id:"u9g",u:9,tok:[{t:"これ",r:"kore",g:"this"},{t:"ある",r:"aru",g:"exists"},{t:"？",r:"?",g:"?"}],en:"Do you have this?",emo:"🔎",mn:"<b>Aru</b> = there is / exists (for things). For people and animals it's <b>iru</b>. Kore aru? = does this exist here."},
{id:"u9h",u:9,tok:[{t:"ふくろ",r:"fukuro",g:"bag"},{t:"いりません",r:"irimasen",g:"not-needed"}],en:"I don't need a bag",emo:"🛍️",mn:"They'll ask at every till. <b>Irimasen</b> = don't need it. Casual version: iranai."},
{id:"u9i",u:9,tok:[{t:"カード",r:"kaado",g:"card"},{t:"で",r:"de",g:"by-means-of"}],en:"By card",emo:"💳",mn:"Same <b>de</b> as nihongo de — 'by means of'. Cash version: <b>genkin de</b>. Two syllables, done."},
{id:"u9j",u:9,tok:[{t:"おねがいします",r:"onegai shimasu",g:"[I] request"}],en:"Yes please / if you would",emo:"🙏",mn:"When the konbini guy asks if you want it heated — <b>onegai shimasu</b>. The polite yes-please for absolutely anything."},
{id:"u9k",u:9,tok:[{t:"おすすめ",r:"osusume",g:"recommendation"},{t:"は",r:"wa",g:"[topic]"},{t:"？",r:"?",g:"?"}],en:"What do you recommend?",emo:"🍶",mn:"<b>Osusume wa?</b> — three syllables that get you the good stuff at any izakaya. Staff love being asked."},
{id:"u9l",u:9,tok:[{t:"ふたり",r:"futari",g:"two-people"},{t:"です",r:"desu",g:"is"}],en:"Table for two",emo:"🍽️",mn:"<b>Hitori / futari / san-nin</b> = 1/2/3 people. The first two are irregular — memorise them, the rest just take ~nin."},
{id:"u9m",u:9,tok:[{t:"べつべつ",r:"betsubetsu",g:"separate"},{t:"で",r:"de",g:"by"}],en:"Separate bills, please",emo:"🧾",mn:"<b>Betsu</b> = separate, doubled for emphasis. Paying together is <b>issho de</b> — same issho as issho ni."},
{id:"u9n",u:9,tok:[{t:"つぎ",r:"tsugi",g:"next"},{t:"の",r:"no",g:"of"},{t:"でんしゃ",r:"densha",g:"train"}],en:"the next train",emo:"🚃",mn:"<b>Densha</b> = electric (den) + wheels (sha) — same 'den' as denwa. <b>No</b> links next→train."},
{id:"u9o",u:9,tok:[{t:"なんばんせん",r:"nanbansen",g:"what-number-line"},{t:"？",r:"?",g:"?"}],en:"Which platform?",emo:"🛤️",mn:"<b>Nan</b> (what) + <b>ban</b> (number) + <b>sen</b> (line). Point at your ticket and say it — someone will walk you there."},
{id:"u9p",u:9,tok:[{t:"まっすぐ",r:"massugu",g:"straight"}],en:"Straight ahead",emo:"⬆️",mn:"<b>Massugu</b> — the double-s is a beat of silence: 'mah(pause)sugu'. Also how you tell a kid to point their board."},
{id:"u9q",u:9,tok:[{t:"みぎ",r:"migi",g:"right"},{t:"に",r:"ni",g:"to"},{t:"まがって",r:"magatte",g:"turn"}],en:"Turn right",emo:"➡️",mn:"<b>Migi</b> = right, <b>hidari</b> = left. Hidari is longer — and so is the word for the side most people find harder."},
{id:"u9r",u:9,tok:[{t:"ちかい",r:"chikai",g:"close"},{t:"？",r:"?",g:"?"}],en:"Is it close by?",emo:"📍",mn:"<b>Chikai</b> = near, <b>tooi</b> = far. Ask before you commit to walking in ski boots."},
{id:"u9s",u:9,tok:[{t:"あるいて",r:"aruite",g:"walking"},{t:"いける",r:"ikeru",g:"can-go"},{t:"？",r:"?",g:"?"}],en:"Can we walk there?",emo:"🚶",mn:"<b>Iku</b> (go) → <b>ikeru</b> (can go). The ~eru ending is 'able to'. Taberu→taberareru, nomu→nomeru."},
{id:"u9t",u:9,tok:[{t:"きっぷ",r:"kippu",g:"ticket"},{t:"かいたい",r:"kaitai",g:"want-to-buy"}],en:"I want to buy a ticket",emo:"🎫",mn:"<b>Kau</b> (buy) + <b>tai</b> (want) = kaitai. Same ~tai as tabetai and aitai. One ending, endless sentences."},
{id:"u9u",u:9,tok:[{t:"にほんご",r:"nihongo",g:"Japanese"},{t:"すこし",r:"sukoshi",g:"a-little"},{t:"だけ",r:"dake",g:"only"}],en:"I only speak a little Japanese",emo:"🤏",mn:"<b>Dake</b> = only. Buys you patience instantly — and they'll slow down without you having to ask."},
{id:"u9v",u:9,tok:[{t:"もう",r:"mou",g:"already"},{t:"だいじょうぶ",r:"daijoubu",g:"fine"},{t:"です",r:"desu",g:"is"}],en:"No thanks, I'm good",emo:"✋",mn:"The polite decline. <b>Daijoubu desu</b> with a small hand-raise means 'no' without ever saying no — very Japanese."},

/* U10 Small Talk & Reactions — the glue that makes you sound native */
{id:"u10a",u:10,tok:[{t:"へえ",r:"hee",g:"[interest]"},{t:"〜",r:"~",g:"[drawn out]"}],en:"Huh, really / interesting",emo:"😯",mn:"Drawn out and falling: <b>hee~</b>. Pure reaction noise. Sprinkle it while she talks and she'll feel heard."},
{id:"u10b",u:10,tok:[{t:"そうなんだ",r:"sou nanda",g:"that's-how-it-is"}],en:"Oh, I see",emo:"💡",mn:"The workhorse reaction. Someone tells you something new — <b>sou nanda</b>. Politer: sou nan desu ne."},
{id:"u10c",u:10,tok:[{t:"なるほど",r:"naruhodo",g:"[I see, indeed]"}],en:"Ah, that makes sense",emo:"🧠",mn:"<b>Naruhodo</b> = the penny dropping. Use it when an explanation actually lands — overuse and it sounds fake."},
{id:"u10d",u:10,tok:[{t:"たしかに",r:"tashika ni",g:"certainly"}],en:"True / good point",emo:"👌",mn:"<b>Tashika</b> = certain. Agreeing with someone's reasoning, not just their fact. The thinking person's 'sou da ne'."},
{id:"u10e",u:10,tok:[{t:"やっぱり",r:"yappari",g:"as-expected"}],en:"I knew it / as I thought",emo:"😏",mn:"<b>Yappari</b> — when something turns out how you suspected. Shortened to <b>yappa</b> in fast speech."},
{id:"u10f",u:10,tok:[{t:"たぶん",r:"tabun",g:"probably"}],en:"Probably / maybe",emo:"🤔",mn:"<b>Tabun</b> = probably. Japanese loves hedging — a bare 'yes' can feel blunt. Tabun softens everything."},
{id:"u10g",u:10,tok:[{t:"でも",r:"demo",g:"but"}],en:"But / though",emo:"↩️",mn:"<b>Demo</b> starts a sentence: 'Demo, samui yo.' — But it's cold. The mid-sentence 'but' is <b>kedo</b>."},
{id:"u10h",u:10,tok:[{t:"だから",r:"dakara",g:"so/that's-why"}],en:"So / that's why",emo:"➡️",mn:"<b>Kara</b> = because (goes after). <b>Dakara</b> = so (starts the next sentence). Same word, opposite ends."},
{id:"u10i",u:10,tok:[{t:"とりあえず",r:"toriaezu",g:"for-now"}],en:"For now / first off",emo:"🍺",mn:"The izakaya opener: <b>toriaezu biiru</b> — 'beer for now'. Also 'let's just do X and figure the rest out'."},
{id:"u10j",u:10,tok:[{t:"べつに",r:"betsu ni",g:"not-particularly"}],en:"Not really / nothing much",emo:"🤷",mn:"<b>Betsu ni</b> = nothing in particular. Careful — said flatly it sounds sulky. Smile when you use it."},
{id:"u10k",u:10,tok:[{t:"なんか",r:"nanka",g:"like/somehow"}],en:"Like / sort of",emo:"💭",mn:"Japan's 'like'. <b>Nanka</b> buys you a second to think and instantly makes you sound casual rather than textbook."},
{id:"u10l",u:10,tok:[{t:"ちなみに",r:"chinami ni",g:"by-the-way"}],en:"By the way",emo:"📎",mn:"<b>Chinami ni</b> — adding a related aside. The natural way to slide a new question into a conversation."},
{id:"u10m",u:10,tok:[{t:"まじで",r:"maji de",g:"seriously"},{t:"？",r:"?",g:"?"}],en:"Seriously?!",emo:"😳",mn:"<b>Maji</b> = serious/for real. Casual — great with her, not with her dad. Kansai version: <b>honma?</b>"},
{id:"u10n",u:10,tok:[{t:"うそ",r:"uso",g:"lie"},{t:"！",r:"!",g:"!"}],en:"No way!",emo:"😱",mn:"Literally 'lie!' — but nobody's calling you a liar. It's pure surprise, like 'get out!'"},
{id:"u10o",u:10,tok:[{t:"そっか",r:"sokka",g:"is-that-so"}],en:"Ah, got it",emo:"🙂",mn:"Softened <b>sou ka</b>. Gentle, accepting — the noise you make when she explains why she's tired."},
{id:"u10p",u:10,tok:[{t:"いいね",r:"ii ne",g:"good, right?"}],en:"Nice! / sounds good",emo:"👍",mn:"<b>Ii</b> (good) + <b>ne</b> (agreement). Yes, it's also the Facebook 'like' button. Same word."},
{id:"u10q",u:10,tok:[{t:"よかった",r:"yokatta",g:"was-good"}],en:"Oh good / thank goodness",emo:"😌",mn:"Past of <b>ii</b> (irregular: ii→yokatta). Relief. She says she's home safe — 'yokatta'."},
{id:"u10r",u:10,tok:[{t:"ざんねん",r:"zannen",g:"regrettable"}],en:"That's a shame",emo:"😞",mn:"<b>Zannen</b> — the plans-cancelled word. Warmer version: <b>zannen dane</b>, 'that's a shame, eh'."},
{id:"u10s",u:10,tok:[{t:"ぜんぜん",r:"zenzen",g:"not-at-all"}],en:"Not at all / no worries",emo:"🙌",mn:"Textbooks say zenzen needs a negative. Real speech: someone apologises, you wave it off — <b>zenzen!</b>"},
{id:"u10t",u:10,tok:[{t:"しかたない",r:"shikata nai",g:"no-way-around-it"}],en:"It can't be helped",emo:"😤",mn:"<b>Shikata</b> = a way of doing. Nai = none. The national shrug — lifts closed, storm rolled in, shikata nai."},
{id:"u10u",u:10,tok:[{t:"どう",r:"dou",g:"how"},{t:"だった",r:"datta",g:"was"},{t:"？",r:"?",g:"?"}],en:"How was it?",emo:"❓",mn:"<b>Dou</b> = how. <b>Datta</b> = was. Your conversation-opener — asks about her day, her meal, her ride."},
{id:"u10v",u:10,tok:[{t:"それで",r:"sore de",g:"and-then"},{t:"？",r:"?",g:"?"}],en:"And then?",emo:"👂",mn:"Keeps her story rolling. <b>Sore de?</b> = so then what. Proof you're listening, not just nodding."},
{id:"u10w",u:10,tok:[{t:"だいじょうぶ",r:"daijoubu",g:"okay"},{t:"だった",r:"datta",g:"was"},{t:"？",r:"?",g:"?"}],en:"Was it okay?",emo:"🫶",mn:"Add <b>datta</b> to any casual adjective to make it past. Samukatta? Tanoshikatta? Daijoubu datta?"},
{id:"u10x",u:10,tok:[{t:"きょう",r:"kyou",g:"today"},{t:"どう",r:"dou",g:"how"},{t:"だった",r:"datta",g:"was"},{t:"？",r:"?",g:"?"}],en:"How was your day?",emo:"🌙",mn:"The nightly question. Ask it every single evening and your Japanese will grow faster than any app can teach you."},

/* Gap-fillers in existing units — needed for real conversation */
{id:"u2n",u:2,tok:[{t:"さびしい",r:"sabishii",g:"lonely"}],en:"I'm lonely / I miss this",emo:"🥲",mn:"<b>Sabishii</b> — lonely. Pairs with aitai: 'sabishii… hayaku aitai.' The one that gets a reply fast."},
{id:"u2o",u:2,tok:[{t:"しあわせ",r:"shiawase",g:"happy/content"}],en:"I'm happy (deeply)",emo:"🕊️",mn:"<b>Ureshii</b> = happy about a thing. <b>Shiawase</b> = happy with your life. Save it for when you mean it."},
{id:"u3l",u:3,tok:[{t:"なんでも",r:"nandemo",g:"anything"},{t:"いい",r:"ii",g:"good"}],en:"Anything's fine",emo:"🤷",mn:"<b>Nandemo ii</b> — the answer that starts every couple's dinner argument, in every language."},
{id:"u4k",u:4,tok:[{t:"なんじ",r:"nanji",g:"what-time"},{t:"に",r:"ni",g:"at"},{t:"おわる",r:"owaru",g:"finish"},{t:"？",r:"?",g:"?"}],en:"What time do you finish?",emo:"🕔",mn:"<b>Owaru</b> = to finish. You met <b>owatta</b> (finished) already — this is the plain present form."},
{id:"u5k",u:5,tok:[{t:"あいたかった",r:"aitakatta",g:"wanted-to-meet"}],en:"I missed you",emo:"🫂",mn:"Past of aitai: <b>aitakatta</b>. Say it the moment you see her, not over text. Timing is the whole phrase."},
{id:"u6j",u:6,tok:[{t:"しらない",r:"shiranai",g:"don't-know"}],en:"I don't know",emo:"🤨",mn:"<b>Shiranai</b> = don't know (a fact). <b>Wakaranai</b> = don't understand. Mixing them up sounds cold — shiranai can read as 'don't care'."},
{id:"u7i",u:7,tok:[{t:"いま",r:"ima",g:"now"},{t:"どこ",r:"doko",g:"where"},{t:"？",r:"?",g:"?"}],en:"Where are you right now?",emo:"📍",mn:"Two words, sent a hundred times a season. Reply: <b>ima gerende!</b> — on the slopes right now."},

/* ---- MORE WORDS FROM CONVERSATIONS ---- */
{id:"n20",u:7,src:"scene",tok:[{t:"もしもし",r:"moshi moshi",g:"[phone hello]"}],en:"Hello? (on the phone)",emo:"☎️",mn:"Phone-only greeting. Legend says it's doubled because ghosts can't say it twice — proof you're human."},
{id:"n21",u:10,src:"scene",tok:[{t:"ねえ",r:"nee",g:"hey"}],en:"Hey / listen",emo:"👋",mn:"<b>Nee</b> — soft attention-getter between close people. Drawn out: 'nee~'. Never with strangers."},
{id:"n22",u:10,src:"scene",tok:[{t:"きいて",r:"kiite",g:"listen"}],en:"Guess what / listen to this",emo:"🗨️",mn:"<b>Kiite kiite!</b> — 'listen, listen!' How every good story starts in Japanese."},
{id:"n23",u:10,src:"scene",tok:[{t:"じつは",r:"jitsu wa",g:"actually"}],en:"Actually / to be honest",emo:"🤫",mn:"<b>Jitsu wa</b> — signals a reveal is coming. She'll lean in the moment you say it."},
{id:"n24",u:6,src:"scene",tok:[{t:"おしえて",r:"oshiete",g:"teach me"}],en:"Tell me / teach me",emo:"🧑‍🏫",mn:"<b>Oshiete</b> — from oshieru (teach). Your job title AND your best learning tool."},
{id:"n25",u:4,src:"scene",tok:[{t:"むかえに",r:"mukae ni",g:"to-fetch"},{t:"いく",r:"iku",g:"go"}],en:"I'll come pick you up",emo:"🚗",mn:"<b>Mukae ni iku</b> — go to meet/collect. The most useful offer you can make in a snowstorm."},
{id:"n26",u:5,src:"scene",tok:[{t:"やすんで",r:"yasunde",g:"rest"}],en:"Get some rest",emo:"🛌",mn:"Same <b>yasumi</b> as oyasumi. Yukkuri yasunde = rest up properly."},
{id:"n27",u:10,src:"scene",tok:[{t:"おなじ",r:"onaji",g:"same"}],en:"Same / me too",emo:"🪞",mn:"<b>Onaji</b> — same. Ordering: onaji no kudasai = the same one, please."},
{id:"n28",u:4,src:"scene",tok:[{t:"はたらいてる",r:"hataraiteru",g:"working"}],en:"I'm working / I work",emo:"🎿",mn:"<b>Hataraku</b> (work) → hataraiteru (currently working). Yama de hataraiteru = I work on the mountain."},
{id:"n29",u:1,src:"scene",tok:[{t:"ひさしぶり",r:"hisashiburi",g:"long-interval"}],en:"Long time no see",emo:"🫱",mn:"<b>Hisashiburi!</b> — for anyone you haven't seen in a while. Add ~dane to soften it."},
{id:"n30",u:5,src:"scene",tok:[{t:"き",r:"ki",g:"spirit"},{t:"を",r:"o",g:"[object]"},{t:"つけて",r:"tsukete",g:"attach"}],en:"Take care / drive safe",emo:"🛞",mn:"Literally 'attach your spirit' — pay attention. What you say as she drives off into snow."},
];

/* ================= CONVERSATION PAIRS (best response) =================
   q = phrase she says (item id), a = your best reply (item id), why = coaching */
const PAIRS=[
{q:"u1c",a:"u1d",why:"<b>Tadaima</b> (I'm home) always gets <b>okaeri</b> (welcome home) — a fixed pair."},
{q:"u1e",a:"u1f",why:"<b>Ittekimasu</b> is answered with <b>itterasshai</b> — 'go and come back safely'."},
{q:"u1b",a:"u7d",why:"Goodnight back — or sweeten it: <b>ii yume mite ne</b>, 'see a good dream'."},
{q:"u7g",a:"u7c",why:"She says she'll be late — a quick <b>ryoukai</b> (roger) is all you need."},
{q:"u7e",a:"u2i",why:"She's apologising for being at work — reassure her: <b>daijoubu</b>, no worries."},
{q:"u5a",a:"u8f",why:"'I like you' → the smoothest reply is <b>watashi mo</b>, 'me too'."},
{q:"u4b",a:"u4c",why:"She's free tomorrow — seal the plan: <b>ikou!</b> let's go."},

/* ================= PARTICLES (fill the gap) ================= */
const PARTICLE_POOL=[{t:"は",r:"wa"},{t:"を",r:"o"},{t:"に",r:"ni"},{t:"が",r:"ga"},{t:"の",r:"no"},{t:"で",r:"de"},{t:"も",r:"mo"},{t:"と",r:"to"},{t:"から",r:"kara"}];
const PSET=new Set(PARTICLE_POOL.map(p=>p.t));
function particleTok(it){
  for(let i=it.tok.length-1;i>=0;i--){const t=it.tok[i];
    if(PSET.has(t.t)&&PARTICLE_POOL.some(p=>p.t===t.t&&p.r===t.r))return {t:t.t,r:t.r,i};}
  return null;
}

  {who:"you",t:"ごめん、しごとちゅう！",r:"gomen, shigoto-chuu!",en:"Sorry, I'm at work!",choose:true,alt:["u5b","u2c"]},
  {who:"her",t:"りょうかい！ひるごはん たべた？",r:"ryoukai! hirugohan tabeta?",en:"Roger! Did you have lunch?",nw:["n11"]},
  {who:"you",t:"まだ。レッスン おわったら たべる。",r:"mada. ressun owattara taberu.",en:"Not yet. I'll eat when the lesson's done.",nw:["n13","n12"]},
  {who:"her",t:"がんばって！",r:"ganbatte!",en:"Good luck!"},
  {who:"you",t:"ありがとう！あとで でんわ する。",r:"arigatou! ato de denwa suru.",en:"Thanks! I'll call later.",choose:true,alt:["u1b","n14"]},
 ]},
{id:"sc5",title:"Meeting her parents",emo:"🙇",learn:["n14","n15","n16"],
 setting:"First time at her parents' door. A small bow, a nervous smile. Keep it polite.",
 lines:[
  {who:"you",t:"はじめまして。デイビッド です。",r:"hajimemashite. Deibiddo desu.",en:"Nice to meet you. I'm David.",nw:["n14"],choose:true,alt:["u1c","u1g"]},
  {who:"dad",t:"よろしく。",r:"yoroshiku.",en:"Nice to meet you too.",nw:["n15"]},
  {who:"you",t:"よろしく おねがい します。",r:"yoroshiku onegai shimasu.",en:"Pleased to meet you (polite)."},
  {who:"mum",t:"にほんご じょうず ね！",r:"nihongo jouzu ne!",en:"Your Japanese is good!"},
  {who:"you",t:"いえいえ、まだまだ です。",r:"ie ie, madamada desu.",en:"No no, I've a long way to go.",nw:["n16"],choose:true,alt:["n6","u6b"]},
 ]},
{id:"sc6",title:"A date, then goodnight",emo:"❤️",learn:["n17","n18","n19"],
 setting:"Evening. You're texting about tomorrow, then winding down for the night.",
 lines:[
  {who:"her",t:"あした ひま？",r:"ashita hima?",en:"Free tomorrow?"},
  {who:"you",t:"うん！なに する？",r:"un! nani suru?",en:"Yeah! What shall we do?",nw:["n19"],choose:true,alt:["u4i","u1b"]},
  {who:"her",t:"えいが みに いこう！",r:"eiga mi ni ikou!",en:"Let's go see a movie!",nw:["n17"]},
  {who:"you",t:"いいね！たのしみ！",r:"ii ne! tanoshimi!",en:"Nice! Can't wait!"},
  {who:"her",t:"きょう たのしかった。おやすみ。",r:"kyou tanoshikatta. oyasumi.",en:"Today was fun. Goodnight.",nw:["n18"]},
  {who:"you",t:"たのしかった！いい ゆめ みてね。だいすき。",r:"tanoshikatta! ii yume mite ne. daisuki.",en:"It was fun! Sweet dreams. Love you.",choose:true,alt:["u1a","u1e"]},
 ]},

/* ================= EXPANSION 2 — longer & branching scenes ================= */
{id:"sc7",title:"Konbini run",emo:"🏪",learn:["u9a","u9g","u9d","u9i","u9h"],
 setting:"9pm, minus eight outside. You've pulled into the konbini on the way home and she's texted you a list.",
 lines:[
  {who:"you",t:"すみません。これ ある？",r:"sumimasen. kore aru?",en:"Excuse me. Do you have this?",nw:["u9a","u9g"],choose:true,alt:["u6b","u1c"]},
  {who:"staff",t:"はい、あそこ です。",r:"hai, asoko desu.",en:"Yes, over there."},
  {who:"you",t:"ありがとうございます！",r:"arigatou gozaimasu!",en:"Thank you!"},
  {who:"staff",t:"ぜんぶで ８９０えん です。",r:"zenbu de happyaku-kyuujuu en desu.",en:"890 yen all together.",nw:["u9d"]},
  {who:"you",t:"カード で おねがいします。",r:"kaado de onegai shimasu.",en:"By card, please.",nw:["u9i"],choose:true,alt:["u3k","u4i"]},
  {who:"staff",t:"ふくろ は？",r:"fukuro wa?",en:"Would you like a bag?"},
  {who:"you",t:"ふくろ いりません。だいじょうぶ です。",r:"fukuro irimasen. daijoubu desu.",en:"No bag, thanks. I'm good.",nw:["u9h"],choose:true,alt:["u9b","u10i"]},
 ]},

{id:"sc8",title:"Finding the platform",emo:"🚉",learn:["u9n","u9o","u9p","u9q","u9s"],
 setting:"Nagano station, Saturday. She's already in the city and you're the wrong side of the ticket gates.",
 lines:[
  {who:"her",t:"なんじ に つく？",r:"nanji ni tsuku?",en:"What time do you get here?"},
  {who:"you",t:"つぎ の でんしゃ で いく！",r:"tsugi no densha de iku!",en:"I'll take the next train!",nw:["u9n"],choose:true,alt:["u4i","u2a"]},
  {who:"her",t:"りょうかい！まってる ね。",r:"ryoukai! matteru ne.",en:"Roger! I'll be waiting."},
  {who:"you",t:"すみません、なんばんせん ですか？",r:"sumimasen, nanbansen desu ka?",en:"Excuse me, which platform?",nw:["u9o"],choose:true,alt:["u9c","u3a"]},
  {who:"stranger",t:"まっすぐ いって、みぎ に まがって。３ばんせん です。",r:"massugu itte, migi ni magatte. san-bansen desu.",en:"Straight ahead, then turn right. Platform 3.",nw:["u9p","u9q"]},
  {who:"you",t:"ありがとうございます！",r:"arigatou gozaimasu!",en:"Thank you very much!"},
  {who:"you",t:"ついた！いま どこ？",r:"tsuita! ima doko?",en:"I'm here! Where are you?",choose:true,alt:["u1c","u7g"]},
  {who:"her",t:"えき の カフェ！あるいて いける よ。",r:"eki no kafe! aruite ikeru yo.",en:"The café by the station! You can walk it.",nw:["u9s"]},
 ]},

{id:"sc9",title:"Izakaya with her friends",emo:"🍺",learn:["n29","u10i","u10p","n28","u9k"],
 setting:"Friday night. Four of her friends, one long low table, and you're the only foreigner in the room. Deep breath.",
 lines:[
  {who:"her",t:"みんな、デイビッド だよ！",r:"minna, Deibiddo da yo!",en:"Everyone, this is David!"},
  {who:"you",branch:[
    {t:"はじめまして。デイビッド です。",r:"hajimemashite. Deibiddo desu.",en:"Nice to meet you. I'm David.",good:true,
     fb:"✓ Textbook-perfect for a first meeting — and the safest opener in any room.",
     reply:{who:"friend",t:"よろしく！ひさしぶり に がいこくじん の ともだち！",r:"yoroshiku! hisashiburi ni gaikokujin no tomodachi!",en:"Nice to meet you! Been ages since we had a foreign friend!",nw:["n29"]}},
    {t:"こんばんは！よろしく おねがいします。",r:"konbanwa! yoroshiku onegai shimasu.",en:"Good evening! Pleased to meet you.",
     fb:"Also fine — a touch more formal. Works better with her boss than her mates.",
     reply:{who:"friend",t:"わ、ていねい！よろしく〜！",r:"wa, teinei! yoroshiku~!",en:"Ooh, polite! Nice to meet you!"}},
    {t:"どうも！",r:"doumo!",en:"Hey / thanks!",
     fb:"Very casual. It works — but with people you've just met it can read as a bit blunt.",
     reply:{who:"friend",t:"どうも！のむ？",r:"doumo! nomu?",en:"Hey! Drink?"}}]},
  {who:"friend",t:"なに のむ？",r:"nani nomu?",en:"What are you drinking?"},
  {who:"you",t:"とりあえず ビール！",r:"toriaezu biiru!",en:"Beer for now!",nw:["u10i"],choose:true,alt:["u3f","u9h"]},
  {who:"friend",t:"いいね！おなじ の ください！",r:"ii ne! onaji no kudasai!",en:"Nice! Same for me, please!",nw:["u10p","n27"]},
  {who:"friend",t:"デイビッド は なに してる の？",r:"Deibiddo wa nani shiteru no?",en:"So what do you do, David?"},
  {who:"you",t:"やま で はたらいてる。スキー の せんせい。",r:"yama de hataraiteru. sukii no sensei.",en:"I work on the mountain. Ski instructor.",nw:["n28"],choose:true,alt:["u2m","u4i"]},
  {who:"friend",t:"えー！すごい！じょうず なんだ！",r:"ee! sugoi! jouzu nanda!",en:"Whoa! Amazing! You must be good!"},
  {who:"you",branch:[
    {t:"いえいえ、まだまだ です。",r:"ie ie, madamada desu.",en:"No no, I've a long way to go.",good:true,
     fb:"✓ Deflecting a compliment is the expected move here. Humility reads as warmth in Japan.",
     reply:{who:"friend",t:"けんきょ〜！いい ひと だね！",r:"kenkyo~! ii hito da ne!",en:"So humble! You're a good one!"}},
    {t:"ありがとう！がんばってる！",r:"arigatou! ganbatteru!",en:"Thanks! I work at it!",
     fb:"Perfectly friendly — just note that accepting a compliment head-on is less common here.",
     reply:{who:"friend",t:"おお、じしん ある ね！いいね！",r:"oo, jishin aru ne! ii ne!",en:"Oh, confident! I like it!"}},
    {t:"たぶん…ぜんぜん です。",r:"tabun... zenzen desu.",en:"Maybe... not at all really.",
     fb:"Understandable, but it undersells you. Madamada is the phrase that does this job cleanly.",
     reply:{who:"friend",t:"ぜんぜん？うそ〜！",r:"zenzen? uso~!",en:"Not at all? No way!"}}]},
  {who:"friend",t:"おすすめ の やま、おしえて！",r:"osusume no yama, oshiete!",en:"Tell us your favourite mountain!",nw:["u9k","n24"]},
 ]},

{id:"sc10",title:"Late night call",emo:"☎️",learn:["n20","n22","n23","n26","n30"],
 setting:"11pm. She's had a rough shift and she's calling instead of texting — which she only does when it's a real one.",
 lines:[
  {who:"her",t:"もしもし…",r:"moshi moshi...",en:"Hello...",nw:["n20"]},
  {who:"you",branch:[
    {t:"だいじょうぶ？なに あった？",r:"daijoubu? nani atta?",en:"You okay? What happened?",good:true,
     fb:"✓ You heard the tone and asked. That's the right instinct in any language.",
     reply:{who:"her",t:"うん…きいて。しごと、ほんとう に たいへん だった。",r:"un... kiite. shigoto, hontou ni taihen datta.",en:"Yeah... listen. Work was genuinely rough.",nw:["n22"]}},
    {t:"おつかれさま！きょう どう だった？",r:"otsukaresama! kyou dou datta?",en:"Good work today! How was your day?",
     fb:"Warm, but a bit bright for her tone. She'll get there — just a beat slower.",
     reply:{who:"her",t:"…あんまり。じつは、ちょっと つらかった。",r:"...anmari. jitsu wa, chotto tsurakatta.",en:"...not great. Actually, it was kind of hard.",nw:["n23"]}},
    {t:"ねえ、こえ が へん だよ。",r:"nee, koe ga hen da yo.",en:"Hey — your voice sounds off.",
     fb:"Direct and observant. Fine with someone this close; would be too blunt with anyone else.",
     reply:{who:"her",t:"わかる？…うん、つかれた。",r:"wakaru? ...un, tsukareta.",en:"You can tell? ...yeah. I'm wiped.",nw:["n21"]}}]},
  {who:"you",t:"そうなんだ…だいじょうぶ だった？",r:"sou nanda... daijoubu datta?",en:"I see... were you okay?",choose:true,alt:["u10m","u4i"]},
  {who:"her",t:"ぜんぜん。でも、はなして よかった。",r:"zenzen. demo, hanashite yokatta.",en:"Not at all. But I'm glad I talked to you."},
  {who:"you",branch:[
    {t:"むかえに いこうか？",r:"mukae ni ikou ka?",en:"Want me to come get you?",good:true,nw:["n25"],
     fb:"✓ Offering something concrete beats sympathy. This is the line that lands.",
     reply:{who:"her",t:"え、いいの？…うれしい。",r:"e, ii no? ...ureshii.",en:"Wait, really? ...that makes me happy."}},
    {t:"ゆっくり やすんで ね。",r:"yukkuri yasunde ne.",en:"Rest up properly, okay?",nw:["n26"],
     fb:"Gentle and right. Slightly softer than offering to actually turn up.",
     reply:{who:"her",t:"ありがとう。やさしい ね。",r:"arigatou. yasashii ne.",en:"Thanks. You're kind."}},
    {t:"しかたない よ。あした は いい ひ に なる。",r:"shikata nai yo. ashita wa ii hi ni naru.",en:"Can't be helped. Tomorrow'll be better.",
     fb:"Careful — shikata nai can land as dismissive when someone wants to be heard first.",
     reply:{who:"her",t:"…うん。そう だ ね。",r:"...un. sou da ne.",en:"...yeah. I guess so."}}]},
  {who:"her",t:"じゃあ、また あした。き を つけて ね。",r:"jaa, mata ashita. ki o tsukete ne.",en:"Okay — see you tomorrow. Take care, yeah?",nw:["n30"]},
  {who:"you",t:"うん。おやすみ。だいすき。",r:"un. oyasumi. daisuki.",en:"Yeah. Goodnight. Love you.",choose:true,alt:["u1e","u3c"]},
 ]},

{id:"sc11",title:"A guest on the mountain",emo:"⛷️",learn:["u9p","u9q","u9r","n24"],
 setting:"Your 10am private lesson. A Japanese guest in his fifties, first time on a board, very polite and very nervous.",
 lines:[
  {who:"you",t:"おはようございます！よろしく おねがいします。",r:"ohayou gozaimasu! yoroshiku onegai shimasu.",en:"Good morning! Let's have a good lesson.",choose:true,alt:["u1a","u5b"]},
  {who:"guest",t:"よろしく おねがいします。はじめて なんです。",r:"yoroshiku onegai shimasu. hajimete nan desu.",en:"Likewise. It's my first time."},
  {who:"you",t:"だいじょうぶ です！ゆっくり いきましょう。",r:"daijoubu desu! yukkuri ikimashou.",en:"No problem! We'll take it slowly.",choose:true,alt:["u4i","u2m"]},
  {who:"guest",t:"ちょっと こわい です…",r:"chotto kowai desu...",en:"I'm a little scared..."},
  {who:"you",t:"わかります。まっすぐ、ゆっくり。だいじょうぶ。",r:"wakarimasu. massugu, yukkuri. daijoubu.",en:"I understand. Straight, slowly. You're fine.",nw:["u9p"],choose:true,alt:["u2l","u10t"]},
  {who:"guest",t:"はい！",r:"hai!",en:"Okay!"},
  {who:"you",t:"いい ですね！つぎ は みぎ に まがって！",r:"ii desu ne! tsugi wa migi ni magatte!",en:"Nice! Now turn right!",nw:["u9q"]},
  {who:"guest",t:"できた！",r:"dekita!",en:"I did it!"},
  {who:"you",t:"すごい！じょうず です よ！",r:"sugoi! jouzu desu yo!",en:"Amazing! You're good at this!",choose:true,alt:["u6b","u10r"]},
  {who:"guest",t:"ありがとうございます！せんせい、また おしえて ください。",r:"arigatou gozaimasu! sensei, mata oshiete kudasai.",en:"Thank you! Please teach me again sometime.",nw:["n24"]},
 ]},

{id:"sc12",title:"When plans fall over",emo:"🌧️",learn:["u10r","u10t","u10e","u10f"],
 setting:"Storm day. The mountain's shut for wind and the trip you'd both been counting on is off.",
 lines:[
  {who:"her",t:"ねえ、あした の やま、しまってる みたい。",r:"nee, ashita no yama, shimatteru mitai.",en:"Hey — looks like the mountain's closed tomorrow.",nw:["n21"]},
  {who:"you",branch:[
    {t:"うそ！まじで？",r:"uso! maji de?",en:"No way! Seriously?",good:true,
     fb:"✓ React first. Japanese conversation runs on this — she'll feel the news landed.",
     reply:{who:"her",t:"まじ。かぜ が つよい から。",r:"maji. kaze ga tsuyoi kara.",en:"Seriously. Because the wind's strong."}},
    {t:"やっぱり。てんき わるかった もんね。",r:"yappari. tenki warukatta mon ne.",en:"Knew it. The forecast was bad, eh.",nw:["u10e"],
     fb:"Calm and knowing — but skipping the reaction can read as not caring much.",
     reply:{who:"her",t:"そう なんだ よね…ざんねん。",r:"sou nanda yo ne... zannen.",en:"Right? ...such a shame.",nw:["u10r"]}},
    {t:"そっか。しかたない ね。",r:"sokka. shikata nai ne.",en:"Ah. Can't be helped, eh.",nw:["u10t"],
     fb:"Very Japanese, very accepting. Just don't skip straight to it — she may want a beat of disappointment first.",
     reply:{who:"her",t:"うん…でも たのしみ に してた のに。",r:"un... demo tanoshimi ni shiteta noni.",en:"Yeah... but I was really looking forward to it."}}]},
  {who:"you",t:"ざんねん。ほんとう に たのしみ だった。",r:"zannen. hontou ni tanoshimi datta.",en:"That's a shame. I was really looking forward to it.",nw:["u10r"],choose:true,alt:["u10p","u3b"]},
  {who:"her",t:"あさって は どう？",r:"asatte wa dou?",en:"How about the day after?"},
  {who:"you",branch:[
    {t:"たぶん だいじょうぶ！しごと、３じ に おわる。",r:"tabun daijoubu! shigoto, san-ji ni owaru.",en:"Probably fine! I finish work at three.",good:true,nw:["u10f"],
     fb:"✓ Hedge, then give her the actual detail. Tabun softens without being vague.",
     reply:{who:"her",t:"いいね！じゃあ ３じはん に むかえに いく！",r:"ii ne! jaa san-ji-han ni mukae ni iku!",en:"Nice! I'll come get you at three thirty then!",nw:["n25"]}},
    {t:"むり かも…しごと ちゅう。",r:"muri kamo... shigoto-chuu.",en:"Might not work... I'm on shift.",
     fb:"Honest, but it closes the door. Adding what time you finish keeps it open.",
     reply:{who:"her",t:"そっか…ざんねん。",r:"sokka... zannen.",en:"Ah... shame."}},
    {t:"いいね！なんじ でも いい よ。",r:"ii ne! nanji demo ii yo.",en:"Sounds good! Any time works.",
     fb:"Keen and easy — though 'any time' quietly hands her all the planning.",
     reply:{who:"her",t:"じゃあ ひる から ね！",r:"jaa hiru kara ne!",en:"Then from midday!"}}]},
  {who:"you",t:"たのしみ！",r:"tanoshimi!",en:"Can't wait!",choose:true,alt:["u2d","u10j"]},
 ]},

{id:"sc13",title:"Sunday, nothing planned",emo:"☀️",learn:["u10x","u10v","u10b","u10l","n23"],
 setting:"Slow Sunday morning. Coffee's on, nowhere to be. This is the conversation you actually want to be able to have.",
 lines:[
  {who:"her",t:"おはよう〜。よく ねた？",r:"ohayou~. yoku neta?",en:"Morning~. Sleep well?"},
  {who:"you",t:"おはよう。うん、よく ねた！",r:"ohayou. un, yoku neta!",en:"Morning. Yeah, slept great!",choose:true,alt:["u2c","u1b"]},
  {who:"her",t:"きのう、ともだち と はなした んだ。",r:"kinou, tomodachi to hanashita nda.",en:"I talked with my friend yesterday."},
  {who:"you",branch:[
    {t:"へえ〜、それで？",r:"hee~, sore de?",en:"Oh yeah? And then?",good:true,nw:["u10v"],
     fb:"✓ This is the whole game. A reaction plus 'and then?' keeps her talking — and you learning.",
     reply:{who:"her",t:"あたらしい しごと、みつけた って！すごく ない？",r:"atarashii shigoto, mitsuketa tte! sugoku nai?",en:"She found a new job! Isn't that great?"}},
    {t:"そうなんだ。",r:"sou nanda.",en:"Oh, I see.",nw:["u10b"],
     fb:"Correct, but it's a full stop. Add sore de? and the story keeps rolling.",
     reply:{who:"her",t:"うん。…あ、あたらしい しごと みつけた って！",r:"un. ...a, atarashii shigoto mitsuketa tte!",en:"Yeah. ...oh, she found a new job!"}},
    {t:"だれ？",r:"dare?",en:"Who?",
     fb:"Fair question — just note that interrupting for detail stalls the story. Reactions first, details after.",
     reply:{who:"her",t:"ゆか だよ！しごと、かわった の。",r:"Yuka da yo! shigoto, kawatta no.",en:"Yuka! She changed jobs."}}]},
  {who:"you",t:"へえ〜！よかった ね。",r:"hee~! yokatta ne.",en:"Wow! That's great.",choose:true,alt:["u10r","u2l"]},
  {who:"her",t:"ね〜。デイビッド は？きょう どう する？",r:"ne~. Deibiddo wa? kyou dou suru?",en:"Right? What about you — what shall we do today?"},
  {who:"you",branch:[
    {t:"なんでも いい よ。なに したい？",r:"nandemo ii yo. nani shitai?",en:"Anything's fine. What do you want to do?",
     fb:"Easy-going, but it puts the whole decision on her. Fine occasionally, not every time.",
     reply:{who:"her",t:"え〜、また それ！",r:"e~, mata sore!",en:"Ugh, that again!"}},
    {t:"じつは、いきたい カフェ が ある んだ。",r:"jitsu wa, ikitai kafe ga aru nda.",en:"Actually, there's a café I want to go to.",good:true,nw:["n23"],
     fb:"✓ Jitsu wa sets up a reveal and having an actual plan is worth more than any grammar.",
     reply:{who:"her",t:"え、ほんとう に？いこう いこう！",r:"e, hontou ni? ikou ikou!",en:"Really? Let's go, let's go!"}},
    {t:"とりあえず コーヒー のもう！",r:"toriaezu koohii nomou!",en:"Coffee first, let's figure it out after!",
     fb:"Very natural — toriaezu is exactly for this. It just delays the decision rather than making one.",
     reply:{who:"her",t:"それ！さんせい！",r:"sore! sansei!",en:"That! Agreed!"}}]},
  {who:"you",t:"ちなみに、しごと なんじ に おわる？",r:"chinami ni, shigoto nanji ni owaru?",en:"By the way, what time do you finish work?",nw:["u10l"],choose:true,alt:["u9c","u6h"]},
  {who:"her",t:"あした は ５じ。むかえに きて くれる？",r:"ashita wa go-ji. mukae ni kite kureru?",en:"Tomorrow it's five. Could you come get me?"},
  {who:"you",t:"もちろん！",r:"mochiron!",en:"Of course!",choose:true,alt:["u4i","u10j"]},
  {who:"her",t:"ありがとう！しあわせ〜。",r:"arigatou! shiawase~.",en:"Thanks! I'm so happy."},
  {who:"you",t:"わたし も。きょう、どう だった？って まいにち きく ね。",r:"watashi mo. kyou, dou datta? tte mainichi kiku ne.",en:"Me too. I'll ask 'how was your day?' every day, yeah.",nw:["u10x"],choose:true,alt:["u2m","u9v"]},
 ]},
];

/* ================= STORAGE ================= */
const KEY="nihongo15_v1";
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return d;}catch(e){}
  return {items:{},sessions:0,tests:[],streak:0,lastDay:null,totalNew:0,scenes:{}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
if(!S.scenes)S.scenes={};
function rec(id){if(!S.items[id])S.items[id]={s:0,c:0,w:0,last:0,seen:0};return S.items[id];}
const seenIds=()=>ITEMS.filter(i=>S.items[i.id]&&S.items[i.id].seen>0);
const DAY=864e5;
const INTERVALS=[0,1,2,4,7,14]; // days by strength
function isDue(it){const r=S.items[it.id];if(!r||!r.seen)return false;
  return (Date.now()-r.last)>=INTERVALS[Math.min(r.s,5)]*DAY*0.9;}

/* ================= SESSION ================= */
let sess=null;
/* New cards are drawn round-robin across topics, not straight down the list —
   otherwise later units (Out & About, Small Talk) stay locked behind 100 cards.
   Units you've already started come first, but every session opens new ground. */
function pickFresh(n){
  const unseen=ITEMS.filter(i=>!S.items[i.id]||!S.items[i.id].seen);
  const byUnit={};
  unseen.forEach(i=>{(byUnit[i.u]=byUnit[i.u]||[]).push(i);});
  const met=u=>ITEMS.filter(i=>i.u===u&&S.items[i.id]&&S.items[i.id].seen).length;
  const order=Object.keys(byUnit).map(Number).sort((a,b)=>{
    const ma=met(a),mb=met(b);
    if((ma>0)!==(mb>0))return ma>0?-1:1;   // units in progress first
    if(ma!==mb)return mb-ma;                // then the furthest along
    return a-b;                             // then by unit order
  });
  // rotate the starting unit each session so no topic waits its turn forever
  const off=(S.sessions||0)%(order.length||1);
  order.push(...order.splice(0,off));
  const out=[];
  while(out.length<n&&order.some(u=>byUnit[u].length)){
    for(const u of order){ if(out.length>=n)break; if(byUnit[u].length)out.push(byUnit[u].shift()); }
  }
  return out;
}
function startSession(){
  const review=shuffle(ITEMS.filter(isDue)).sort((a,b)=>rec(a.id).s-rec(b.id).s).slice(0,6);
  const fresh=pickFresh(review.length>=5?4:5);
  sess={review,fresh,phase:"intro",idx:0,quiz:[],qIdx:0,right:0,wrong:0,t0:Date.now(),results:{}};
  renderSession();
}
function elapsed(){return Math.floor((Date.now()-sess.t0)/60000);}
function sessTop(title,prog){
  return `<div class="topbar"><button class="xbtn" onclick="quitSession()">✕</button>
    <div style="flex:1"><div class="lbl acc">${title}</div>
    <div class="pbar mt8"><div style="width:${prog*100}%"></div></div></div>
    <span class="timer">${elapsed()}′</span></div>`;
}
function quitSession(){if(confirm("End this session? Progress on graded cards is already saved."))home();}

function renderSession(){
  const s=sess;
  if(s.phase==="intro"){
    app.innerHTML=`<div class="fade center" style="margin:auto 0;display:flex;flex-direction:column;justify-content:center;flex:1">
      <div class="big-emo">🏔️</div>
      <div class="h1 mt16">Today's session</div>
      <div class="sub mt12">${s.review.length?`<b style="color:var(--acc2)">${s.review.length} review</b> · `:""}<b style="color:var(--acc)">${s.fresh.length} new</b> · then a quick practice round</div>
      <button class="btn primary mt28" onclick="nextPhase()">GO · いこう！</button>
      <button class="btn ghost mt12" onclick="home()">BACK</button></div>`;
    return;
  }
  if(s.phase==="review")return reviewCard();
  if(s.phase==="learn")return learnCard();
  if(s.phase==="quiz")return quizCard();
  if(s.phase==="done")return sessionDone();
}
function nextPhase(){
  const s=sess;
  if(s.phase==="intro")s.phase=s.review.length?"review":(s.fresh.length?"learn":"quiz");
  else if(s.phase==="review")s.phase=s.fresh.length?"learn":"quiz";
  else if(s.phase==="learn")s.phase="quiz";
  s.idx=0;
  if(s.phase==="quiz")buildQuiz();
  renderSession();
}

/* --- review flashcards (self-graded) --- */
function reviewCard(){
  const s=sess,it=s.review[s.idx];
  if(!it)return nextPhase();
  app.innerHTML=`<div class="fade">${sessTop("WARM-UP REVIEW",s.idx/s.review.length)}
    <div class="card center" style="padding:34px 20px">
      <span class="tag rev">REVIEW ${s.idx+1}/${s.review.length}</span>
      <div class="mt20">${glossOrHide(it)}</div>
      <div id="reveal" class="hidden">
        <div class="natural">${esc(it.en)}</div>

      </div>

      <div id="gradeRow" class="grades hidden">
        <button class="btn g-again" onclick="gradeReview(0)">AGAIN<br><small>forgot it</small></button>
        <button class="btn g-good" onclick="gradeReview(1)">GOOD<br><small>got there</small></button>
        <button class="btn g-easy" onclick="gradeReview(2)">EASY<br><small>instant</small></button>

    </div></div>`;
}
function glossOrHide(it){
  return `<div class="gloss">`+it.tok.map(t=>
    `<div class="tok"><span class="ro">${esc(t.r)}</span><span class="jp">${esc(t.t)}</span><span class="en rv hidden">${esc(t.g)}</span></div>`).join("")+`</div>`;

function revealCard(){
  document.querySelectorAll(".rv").forEach(e=>e.classList.remove("hidden"));

function gradeReview(g){
  const it=sess.review[sess.idx];
  if(g===0){grade(it.id,false);sess.results[it.id]=false;}
  else{grade(it.id,true,g);sess.results[it.id]=true;}
  sess.idx++;renderSession();
}

/* --- learn new --- */
function learnCard(){

  if(!it)return nextPhase();

    </div></div>`;
