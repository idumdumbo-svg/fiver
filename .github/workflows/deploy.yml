name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job only reads, the deploy job gets Pages access.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - run: node build.js

      # Nothing ships unless all three suites pass.
      - name: Logic tests (money)
        run: node test.js
      - name: Logic tests (food)
        run: node test-cal.js
      - name: Logic tests (currency)
        run: node test-fx.js
      - name: Logic tests (behaviour)
        run: node test-curb.js
      - name: App tests
        run: node uitest.js
      - name: Offline / installability tests
        run: node pwatest.js

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
